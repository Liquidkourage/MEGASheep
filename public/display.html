<body>
    <!-- Display Screen (for projector/streaming) -->
    <div id="displayScreen" class="display-mode">
        <!-- Content is generated by JavaScript -->
    </div>

    <script>
        // Display-only JavaScript
        // Old showDisplayScreen function removed - using individual screen functions now

        // Removed updateDisplayScreen function - now using individual screen functions

        function updateDisplayQuestion(question, questionNumber, timer) {
            document.getElementById('displayQuestionNumber').textContent = questionNumber;
            document.getElementById('displayQuestionText').textContent = question;
            document.getElementById('displayTimer').textContent = timer;
        }

        function updateDisplayAnswers(answers) {
            const displayAnswersList = document.getElementById('displayAnswersList');
            displayAnswersList.innerHTML = '';
            
            if (answers && answers.length > 0) {
                // Sort answers by count (most popular first)
                const sortedAnswers = [...answers].sort((a, b) => b.count - a.count);
                
                // Limit display for large answer sets
                const maxAnswers = answers.length > 15 ? 15 : answers.length;
                const displayAnswers = sortedAnswers.slice(0, maxAnswers);
                
                displayAnswers.forEach((answer, index) => {
                    const answerCard = document.createElement('div');
                    answerCard.className = `answer-card ${index < 3 ? 'top-answer' : ''}`;
                    answerCard.innerHTML = `
                        <div class="answer-rank">#${index + 1}</div>
                        <div class="answer-text">${answer.answer}</div>
                        <div class="answer-count">${answer.count} players</div>
                    `;
                    displayAnswersList.appendChild(answerCard);
                });
                
                // Add indicator if there are more answers
                if (answers.length > maxAnswers) {
                    const moreIndicator = document.createElement('div');
                    moreIndicator.className = 'more-answers-indicator';
                    moreIndicator.innerHTML = `
                        <p>... and ${answers.length - maxAnswers} more answers</p>
                    `;
                    displayAnswersList.appendChild(moreIndicator);
                }
            }
        }

        function updateDisplayScoring(answers, scores) {
            const displayAnswersResults = document.getElementById('displayAnswersResults');
            displayAnswersResults.innerHTML = '';
            
            if (answers && answers.length > 0) {
                // Sort answers by points (highest scoring first)
                const sortedAnswers = [...answers].sort((a, b) => b.points - a.points);
                
                // Limit display for large answer sets
                const maxAnswers = answers.length > 12 ? 12 : answers.length;
                const displayAnswers = sortedAnswers.slice(0, maxAnswers);
                
                displayAnswers.forEach((answer, index) => {
                    const answerCard = document.createElement('div');
                    answerCard.className = `answer-card ${answer.correct ? 'correct' : 'incorrect'} ${index < 3 ? 'top-answer' : ''}`;
                    answerCard.innerHTML = `
                        <div class="answer-rank">#${index + 1}</div>
                        <div class="answer-text">${answer.answer}</div>
                        <div class="answer-count">${answer.count} players</div>
                        <div class="answer-points">${answer.points} points</div>
                    `;
                    displayAnswersResults.appendChild(answerCard);
                });
                
                // Add indicator if there are more answers
                if (answers.length > maxAnswers) {
                    const moreIndicator = document.createElement('div');
                    moreIndicator.className = 'more-answers-indicator';
                    moreIndicator.innerHTML = `
                        <p>... and ${answers.length - maxAnswers} more answers</p>
                    `;
                    displayAnswersResults.appendChild(moreIndicator);
                }
            }
            
            const displayCurrentScores = document.getElementById('displayCurrentScores');
            displayCurrentScores.innerHTML = '';
            
            if (scores && scores.length > 0) {
                // Sort by score (highest first)
                const sortedScores = [...scores].sort((a, b) => b.score - a.score);
                
                // Show top 15 players for large groups
                const maxScores = scores.length > 15 ? 15 : scores.length;
                const displayScores = sortedScores.slice(0, maxScores);
                
                displayScores.forEach((score, index) => {
                    const scoreCard = document.createElement('div');
                    scoreCard.className = `score-card ${index < 3 ? 'top-score' : ''}`;
                    scoreCard.innerHTML = `
                        <div class="score-rank">#${index + 1}</div>
                        <div class="player-name">${score.name}</div>
                        <div class="player-score">${score.score} points</div>
                    `;
                    displayCurrentScores.appendChild(scoreCard);
                });
                
                // Add indicator if there are more players
                if (scores.length > maxScores) {
                    const moreIndicator = document.createElement('div');
                    moreIndicator.className = 'more-scores-indicator';
                    moreIndicator.innerHTML = `
                        <p>... and ${scores.length - maxScores} more players</p>
                    `;
                    displayCurrentScores.appendChild(moreIndicator);
                }
            }
        }

        function updateDisplayGameOver(scores) {
            const displayFinalScores = document.getElementById('displayFinalScores');
            displayFinalScores.innerHTML = '';
            
            if (scores && scores.length > 0) {
                // Sort by score (highest first)
                const sortedScores = [...scores].sort((a, b) => b.score - a.score);
                
                // Show top 20 players for large groups
                const maxScores = scores.length > 20 ? 20 : scores.length;
                const displayScores = sortedScores.slice(0, maxScores);
                
                displayScores.forEach((score, index) => {
                    const scoreCard = document.createElement('div');
                    scoreCard.className = `final-score-card ${index === 0 ? 'winner' : ''} ${index < 5 ? 'top-finisher' : ''}`;
                    scoreCard.innerHTML = `
                        <div class="score-rank">#${index + 1}</div>
                        <div class="player-name">${score.name}</div>
                        <div class="player-score">${score.score} points</div>
                        ${index === 0 ? '<div class="winner-badge">🏆 Winner!</div>' : ''}
                    `;
                    displayFinalScores.appendChild(scoreCard);
                });
                
                // Add indicator if there are more players
                if (scores.length > maxScores) {
                    const moreIndicator = document.createElement('div');
                    moreIndicator.className = 'more-scores-indicator';
                    moreIndicator.innerHTML = `
                        <p>... and ${scores.length - maxScores} more players</p>
                    `;
                    displayFinalScores.appendChild(moreIndicator);
                }
            }
        }

        // Display state management
        let gameState = null;
        let socket = null;
        let displayGameCode = null;
        let scoreParadeGen = 0;
        const lockstepCtx = { lastSeq: -1, lastEpoch: '' };

        function applyDisplayState(packet, source) {
            try {
                const LS = window.MEGASheepLockstep;
                const state = (LS && LS.unwrapGameState) ? LS.unwrapGameState(packet) : packet;
                if (!state || typeof state.gameCode !== 'string') return;
                const result = (LS && LS.applyServerState)
                    ? LS.applyServerState(state, lockstepCtx)
                    : { applied: true, epochChanged: true, state };
                if (!result.applied) return;

                if (state.gameCode) {
                    displayGameCode = state.gameCode;
                    sessionStorage.setItem('displayGameCode', displayGameCode);
                    window.currentGameCode = displayGameCode;
                }

                if (!result.epochChanged && gameState) {
                    gameState = state;
                    if (state.gameState === 'waiting') {
                        updatePlayersOnly(state);
                        return;
                    }
                    if (state.gameState === 'playing' || state.gameState === 'grading') {
                        const count = typeof state.answersReceived === 'number'
                            ? state.answersReceived
                            : (Array.isArray(state.players) ? 0 : 0);
                        const total = typeof state.playerCount === 'number'
                            ? state.playerCount
                            : (Array.isArray(state.players) ? state.players.length : 0);
                        try { updateResponseIndicator(count, total, state.answeredPlayers); } catch (_) {}
                        return;
                    }
                }

                updateDisplayFromGameState(state);
            } catch (e) {
                console.warn('applyDisplayState failed', source, e);
            }
        }
        
        function initializeSocket() {
            socket = io({
                transports: ['websocket', 'polling'],
                timeout: 20000,
                forceNew: false,
                reconnection: true,
                reconnectionAttempts: 25,
                reconnectionDelay: 500,
                reconnectionDelayMax: 3000,
                maxReconnectionAttempts: 25,
                autoConnect: true
            });
            
            socket.on('connect', () => {
                console.log('🔌 Display connected to server');
                // Request a pairing code so host can attach this display to a game
                try { socket.emit('requestDisplayPairingCode'); } catch (_) {}
                
                // Check for stored game code first (for reconnections)
                const storedGameCode = sessionStorage.getItem('displayGameCode');
                
                // Check URL parameters
                const urlParams = new URLSearchParams(window.location.search);
                const codeFromUrl = urlParams.get('game');
                const resetParam = urlParams.get('reset');
                
                // Force reset if ?reset=true
                if (resetParam === 'true') {
                    console.log('🔄 Display reset requested via URL parameter');
                    displayGameCode = null;
                    sessionStorage.removeItem('displayGameCode');
                    window.currentGameCode = null;
                } else if (codeFromUrl) {
                    displayGameCode = codeFromUrl;
                    sessionStorage.setItem('displayGameCode', displayGameCode);
                    console.log('📺 Using game code from URL:', displayGameCode);
                } else if (storedGameCode) {
                    displayGameCode = storedGameCode;
                    console.log('🔄 Using stored game code for reconnection:', displayGameCode);
                } else {
                    displayGameCode = null;
                    console.log('📺 No game code available');
                }
                
                // Auto-rejoin game if we have any code
                try {
                    if (displayGameCode) {
                        console.log('🔄 Auto-joining display to game:', displayGameCode);
                        socket.emit('joinDisplayRoom', { gameCode: displayGameCode });
                        socket.emit('requestState', { gameCode: displayGameCode });
                        socket.emit('getGameState', { gameCode: displayGameCode });
                    }
                } catch (e) {
                    console.warn('Display auto-rejoin failed:', e);
                }
                
                if (displayGameCode) {
                    console.log('📺 Display connecting to game:', displayGameCode);
                    // Join the specific game room
                    socket.emit('joinDisplayRoom', { gameCode: displayGameCode });
                } else {
                    console.log('📺 No game code specified, showing welcome screen for pairing');
                    showIntroScreen();
                }
            });
            socket.on('displayPairingCode', (data) => {
                const code = data?.code || '----';
                window.displayPairingCode = code;
                console.log('📺 Display pairing code:', code);
                // If intro screen visible, regenerate QR/text to show pairing code to host/operator
                try { showIntroScreen(); } catch (_) {}
            });
            
            socket.on('disconnect', () => {
                console.log('🔌 Display disconnected from server - attempting rejoin...');
                // Don't reset to intro screen - try to rejoin the game instead
                if (displayGameCode) {
                    console.log(`🔄 Display will attempt to rejoin game ${displayGameCode} on reconnect`);
                } else {
                    console.log('⚠️ No game code stored, will show intro screen on reconnect');
                }
            });
            
            socket.on('connect_error', (error) => {
                console.error('❌ Display connection error:', error);
                console.log('🔄 Will retry connection automatically');
                // Don't reset to intro screen - let Socket.IO handle reconnection
            });
            
            socket.on('state', (gameStateData) => applyDisplayState(gameStateData, 'state'));
            socket.on('displayGameState', (gameStateData) => {
                if (!gameStateData) {
                    showIntroScreen();
                    return;
                }
                applyDisplayState(gameStateData, 'displayGameState');
            });

            socket.on('displayError', (data) => {
                const msg = (data && data.message) ? String(data.message) : '';
                console.error('📺 Display error:', msg);
                if (/not found|no game|unpaired|invalid code|not paired|missing game/i.test(msg)) {
                displayGameCode = null;
                sessionStorage.removeItem('displayGameCode');
                window.currentGameCode = null;
                showIntroScreen();
                }
            });
            
            socket.on('gameCreated', (gameStateData) => {
                if (gameStateData) applyDisplayState(gameStateData, 'gameCreated');
                else showWaitingScreen();
            });
            socket.on('gameStarted', (gameStateData) => applyDisplayState(gameStateData, 'gameStarted'));
            socket.on('nextQuestion', (gameStateData) => applyDisplayState(gameStateData, 'nextQuestion'));
            socket.on('roundComplete', (gameStateData) => applyDisplayState(gameStateData, 'roundComplete'));
            socket.on('gradingComplete', (gameStateData) => applyDisplayState(gameStateData, 'gradingComplete'));
            socket.on('gameFinished', (gameStateData) => applyDisplayState(gameStateData, 'gameFinished'));
            socket.on('showOverallLeaderboard', (gameStateData) => applyDisplayState(gameStateData, 'showOverallLeaderboard'));
            
            socket.on('timerUpdate', (data) => {
                if (gameState && gameState.gameState === 'playing') {
                    updateDisplayTimer(data.timeLeft);
                }
            });
            
            socket.on('playerJoined', (gameStateData) => applyDisplayState(gameStateData, 'playerJoined'));
            
            socket.on('virtualPlayerJoined', (data) => {
                const LS = window.MEGASheepLockstep;
                const state = (LS && LS.unwrapGameState) ? LS.unwrapGameState(data) : data;
                if (state && typeof state.gameState === 'string' && Array.isArray(state.players)) {
                    applyDisplayState(data, 'virtualPlayerJoined');
                }
            });
            
            socket.on('gameSettingsUpdated', (settings) => {
                console.log('Display: Game settings updated', settings);
                // Update display if needed for settings changes
                if (gameState) {
                    updateDisplayFromGameState(gameState);
                }
            });
            
            socket.on('playerLeft', (gameStateData) => applyDisplayState(gameStateData, 'playerLeft'));
            
            socket.on('answerUpdate', (data) => {
                if (gameState && (gameState.gameState === 'playing' || gameState.gameState === 'questionActive' || gameState.gameState === 'grading')) {
                    // Prefer authoritative snapshot if provided
                    let count = data.answersReceived;
                    try {
                        if (data.answers && typeof data.answers === 'object') {
                            const stableSet = new Set();
                            Object.keys(data.answers).forEach(sid => {
                                try {
                                    const p = (gameState.players || []).find(pl => pl.id === sid);
                                    const stable = p?.stableId || sid;
                                    stableSet.add(stable);
                                } catch (_) {}
                            });
                            if (stableSet.size > 0) count = stableSet.size;
                        }
                    } catch (_) {}
                    if (Array.isArray(data.answeredPlayers) && gameState) {
                        gameState.answeredPlayers = data.answeredPlayers;
                    }
                    if (Array.isArray(data.sentBackPlayers) && gameState) {
                        gameState.sentBackPlayers = data.sentBackPlayers;
                    }
                    updateResponseIndicator(count, data.totalPlayers, data.answeredPlayers);
                }
            });
            
            socket.on('questionComplete', (gameStateData) => applyDisplayState(gameStateData, 'questionComplete'));

            // Auto-generate virtual responses when question starts
            socket.on('questionStarted', (data) => {
                console.log('🎭 Question started');
            });
        }

        function updateDisplayFromGameState(newGameState) {
            gameState = newGameState;
            
            if (!gameState) {
                showIntroScreen();
                return;
            }
            
            console.log('📺 Updating display with game state:', gameState.gameState);
            console.log('📺 Full game state data:', gameState);
            
            switch (gameState.gameState) {
                case 'waiting':
                    console.log('📺 Showing waiting screen');
                    showWaitingScreen();
                    break;
                case 'playing':
                    console.log('📺 Showing playing screen');
                    showPlayingScreen();
                    break;
                case 'grading':
                    console.log('📺 Keeping pasture on screen during grading');
                    if (!document.querySelector('#displayScreen .tv-play')) {
                        showPlayingScreen();
                    } else {
                        updateDisplayTimer(typeof gameState.timeLeft === 'number' ? gameState.timeLeft : 0);
                        updateResponseIndicator(
                            gameState.answersReceived || 0,
                            (gameState.players || []).length,
                            gameState.answeredPlayers
                        );
                    }
                    break;
                case 'scoring':
                    console.log('📺 Showing scoring screen');
                    showScoringScreen();
                    break;
                case 'roundComplete':
                    console.log('📺 Showing round complete screen');
                    showRoundCompleteScreen();
                    break;
                case 'overallLeaderboard':
                    console.log('📺 Showing overall leaderboard screen (podium)');
                    showOverallLeaderboardScreen(gameState);
                    break;
                case 'leaderboard':
                    console.log('📺 Showing leaderboard screen');
                    showLeaderboardScreen();
                    break;
                case 'finished':
                    console.log('📺 Showing game finished screen');
                    showGameFinishedScreen();
                    break;
                default:
                    console.log('📺 Unknown game state, showing intro screen');
                    showIntroScreen();
            }
        }

        // Efficient update function - only updates player grid and count
        function updatePlayersOnly(newGameState) {
            // Always update the global game state
            gameState = newGameState;
            
            // Update player count in header (if we're in waiting state)
            const playerCountElement = document.querySelector('.display-status');
            if (playerCountElement && gameState.gameState === 'waiting') {
                const n = (gameState.players || []).length;
                playerCountElement.textContent = `${n} player${n === 1 ? '' : 's'}`;
            }
            
            layoutLobbyPlayers();
            
            console.log(`📺 Updated players only: ${gameState.players.length} players`);
            
            // Only do full display update if we're transitioning to a different game state
            // (like from waiting to playing, but not just adding players)
            if (gameState.gameState !== 'waiting') {
                console.log(`📺 Game state changed to ${gameState.gameState}, doing full update`);
                updateDisplayFromGameState(gameState);
            }
        }

        function waitSheepHtml() {
            return `
                <div class="tv-wait-ewe" aria-hidden="true">
                    <span class="tv-wait-think"><i></i><i></i><i></i></span>
                    <span class="tv-wait-art"><span class="tv-wait-strip"></span></span>
                </div>
            `;
        }

        function skyNameHtml() {
            return `
                <h1 class="tv-sky-name">
                    <img src="sprites/megasheep-title.png?v=2026-11-19T00-58-00" alt="MEGASheep">
                </h1>
            `;
        }

        function showIntroScreen() {
            preventAllScrolling();
            const pairCode = window.displayPairingCode || '----';
            const connecting = !!displayGameCode;
            document.getElementById('displayScreen').innerHTML = `
                <div class="tv-stage tv-intro">
                    ${pastureSceneHtml({ pen: false })}
                    ${skyNameHtml()}
                    <aside class="tv-sign tv-intro-sign">
                        <img class="tv-sign-art" src="sprites/meadow-sign.png?v=2026-11-18T27-20-00" alt="" aria-hidden="true">
                        <div class="tv-sign-face">
                            <p class="tv-intro-brand">by Liquid Kourage Entertainment</p>
                            <p class="tv-intro-blurb">Pull the wool over everyone’s eyes with ewe‑nique answers to fleece the competition.<br>Flock around and find out who’s a shear genius and who’s mutton but a wolf in sheep’s clothing.</p>
                            ${connecting ? `
                                <div id="qrCodeIntro" class="qr-code"></div>
                                <p class="tv-lobby-code">${displayGameCode}</p>
                            ` : `
                                <p class="tv-pair-code">${pairCode}</p>
                            `}
                        </div>
                    </aside>
                    <div class="tv-intro-wait">${waitSheepHtml()}</div>
                </div>
            `;
            if (!connecting) return;
            setTimeout(() => {
                const introUrl = window.currentGameCode ? `https://megasheep.liquidkourage.com/?game=${window.currentGameCode}` : 'https://megasheep.liquidkourage.com';
                generateQRCode('qrCodeIntro', introUrl);
            }, 100);
        }

        function preventAllScrolling() {
            // Aggressive scroll prevention - NO SCROLLING EVER
            document.body.style.overflow = 'hidden !important';
            document.documentElement.style.overflow = 'hidden !important';
            document.body.style.height = '100vh';
            document.documentElement.style.height = '100vh';
            document.body.style.width = '100vw';
            document.documentElement.style.width = '100vw';
            document.body.style.margin = '0';
            document.body.style.padding = '0';
            document.documentElement.style.margin = '0';
            document.documentElement.style.padding = '0';
            
            // Prevent any possible overflow on the main container
            const displayScreen = document.getElementById('displayScreen');
            if (displayScreen) {
                displayScreen.style.overflow = 'hidden !important';
                displayScreen.style.height = '100vh';
                displayScreen.style.width = '100vw';
                displayScreen.style.boxSizing = 'border-box';
            }
        }

                    <div class="tv-pasture-ground" aria-hidden="true"></div>
                    ${withPen ? `<div class="tv-pen tv-pen-back" aria-hidden="true">
                        <img class="tv-pen-art" src="sprites/pen-back.png?v=2026-11-19T04-05-00" alt="">

                    <div class="tv-flock" id="flockChorus"></div>

        function showWaitingScreen() {
            preventAllScrolling();
            const count = (gameState.players || []).length;
            document.getElementById('displayScreen').innerHTML = `
                <div class="tv-stage tv-lobby">
                    ${pastureSceneHtml({ pen: false })}
                    ${skyNameHtml()}
                    <aside class="tv-sign tv-lobby-join">
                        <img class="tv-sign-art tv-sign-art-whole" src="sprites/meadow-sign-tall.png?v=2026-11-19T00-20-00" alt="" aria-hidden="true">
                        <img class="tv-sign-art tv-sign-art-nibble" src="sprites/meadow-sign-tall.png?v=2026-11-19T00-20-00" alt="" aria-hidden="true">
                        <img class="tv-sign-art tv-sign-art-full" src="sprites/meadow-sign-tall.png?v=2026-11-19T00-20-00" alt="" aria-hidden="true">
                        <img class="tv-sign-bite-edge tv-sign-bite-edge-nibble" src="sprites/sign-bite-edge-nibble.png?v=2026-11-19T01-05-00" alt="" aria-hidden="true">
                        <img class="tv-sign-bite-edge tv-sign-bite-edge-full" src="sprites/sign-bite-edge.png?v=2026-11-19T01-05-00" alt="" aria-hidden="true">
                        <img class="tv-sign-bite-plug" src="sprites/sign-bite-plug.png?v=2026-11-19T01-05-00" alt="" aria-hidden="true">
                        <span class="tv-sign-crumbs" aria-hidden="true"><i></i><i></i><i></i></span>
                        <div class="tv-sign-face">
                            <div id="qrCodeWaiting" class="qr-code"></div>

        function packRegion(n, box) {
            if (n <= 0) return [];
            const spanX = Math.max(1, box.right - box.left);
            const spanY = Math.max(1, box.bottom - box.top);
            const tall = spanY >= spanX * 1.4;
            const rows = tall
                ? (n <= 3 ? 1 : n <= 8 ? 2 : n <= 15 ? 3 : n <= 24 ? 4 : 5)
                : (n <= 7 ? 1 : n <= 16 ? 2 : n <= 30 ? 3 : 4);
            const counts = [];
            let remaining = n;
            for (let r = 0; r < rows; r += 1) {
                const leftRows = rows - r;
                const take = r === rows - 1 ? remaining : Math.ceil(remaining / leftRows);
                counts.push(take);
                remaining -= take;
            }
            const slots = [];
            for (let r = 0; r < rows; r += 1) {
                const count = counts[r];
                const y = box.top + ((r + 0.58) / rows) * (box.bottom - box.top);
                const scale = rows === 1 ? 1 : 0.86 + (r / Math.max(rows - 1, 1)) * 0.16;
                for (let c = 0; c < count; c += 1) {

        function packTrapezoid(n, far, near) {

            const spanX = Math.max(1, ((far.right - far.left) + (near.right - near.left)) / 2);
            const spanY = Math.max(1, near.y - far.y);
            const tall = spanY >= spanX * 1.15;
            const rows = tall
                ? (n <= 3 ? 1 : n <= 8 ? 2 : n <= 15 ? 3 : n <= 24 ? 4 : 5)
                : (n <= 8 ? 1 : n <= 16 ? 2 : n <= 24 ? 3 : 4);
            const counts = [];
            let remaining = n;
            for (let r = 0; r < rows; r += 1) {
                const leftRows = rows - r;

                counts.push(take);
                remaining -= take;
            }
            const slots = [];
            for (let r = 0; r < rows; r += 1) {

                const t = rows <= 1 ? 0.58 : r / (rows - 1);
                const u = 0.08 + t * 0.84;
                const y = far.y + u * spanY;

                const right = far.right + u * (near.right - far.right);

                }

                q = b;

                m = b;

            const named = extra.named !== false;
            const scatter = extra.tight ? 0 : (named ? 0.12 : 0.7);
            const bounce = extra.tight ? 0 : (named ? 0.7 : 1.15);
            const scale = (g.scale || depth.scale) * (extra.scale || 1);
            const offstage = extra.paradeWait || extra.parade;
            const gxRaw = g.x + ((hash % 5) - 2) * scatter;
            const gyRaw = g.y + (((hash >> 3) % 5) - 2) * bounce;
            return {
                id: player.stableId || player.id || player.name,
                name: player.name || 'Sheep',
                label: flockLabel(player.name || 'Sheep', names),
                score: Number(player.score) || 0,
                named,
                paradeWait: !!extra.paradeWait,
                parade: !!extra.parade,
                gx: offstage ? gxRaw : Math.min(96, Math.max(2, gxRaw)),
                gy: offstage ? gyRaw : Math.min(93, Math.max(extra.minGy != null ? extra.minGy : 58, gyRaw)),
                px: 80,
                py: 70,
                ox: 60,
                oy: 70,
                scale,
                z: g.z || depth.z,
                coat: (hash % 2) + 1,
                idle: ((hash % 17) * 0.18).toFixed(2),
                mood: (hash % 3 === 0) ? 'eat' : 'idle'
            };
        }

        function playerMatchesGroup(player, group) {
            const people = (group && group.players) || [];
            const name = String(player.name || '').toLowerCase();
            const ids = [player.id, player.stableId].filter(Boolean).map(String);
            return people.some((entry) => {
                if (typeof entry === 'string') {
                    return entry.toLowerCase() === name || ids.includes(entry);
                }
                if (!entry) return false;
                if (entry.id && ids.includes(String(entry.id))) return true;
                if (entry.stableId && ids.includes(String(entry.stableId))) return true;
                return String(entry.name || '').toLowerCase() === name;
            });
        }

        const PARADE_PARK_X = -28;
        const PARADE_START_X = -16;
        const PARADE_END_X = 118;
        const PARADE_Y = 83;
        const SCORE_PARADE_HOLDERS = 12;

        function layoutScoreBanners(groups) {
            const n = groups.length;
            const left = SCORE_BANNER_LEFT;
            const right = SCORE_BANNER_RIGHT;
            const span = right - left;
            const tilts = [-0.9, 0.7, -0.45, 1.0, -0.65, 0.5];
            return groups.map((group, index) => {
                const x = n <= 1 ? 42 : left + ((index + 0.5) / n) * span;
                const y = 79 + ((index % 2) * 2.2) + ((index % 3) - 1) * 0.6;
                const width = n <= 1 ? 11.2 : Math.min(11, Math.max(9.4, (span / n) * 0.68));
                return Object.assign({}, group, {
                    x,
                    y,
                    width,
                    tilt: tilts[index % tilts.length]
                });
            });
        }

        function scoreAnswerModels() {
            const { submittedAnswers, correctNotGiven } = categorizeAnswersForDisplay();
            const hits = (submittedAnswers || []).slice().sort((a, b) => {
                const byPoints = (Number(b.points) || 0) - (Number(a.points) || 0);
                if (byPoints) return byPoints;
                return (Number(b.count) || 0) - (Number(a.count) || 0);
            }).map((group) => ({
                kind: 'hit',
                answer: group.answer,
                points: Number(group.points) || 0,
                players: group.players || [],
                count: Number(group.count) || (group.players || []).length
            }));
            const misses = (correctNotGiven || []).map((answer) => ({
                kind: 'miss',
                answer,
                points: 0,
                players: [],
                count: 0
            }));
            return {
                field: layoutScoreBanners(hits.slice(0, SCORE_BANNER_FIELD)),
                parade: hits.slice(SCORE_BANNER_FIELD).concat(misses)
            };
        }

        function packBannerHolders(count, x, y) {
            const n = Math.max(1, count);
            if (n === 1) {
                return [{ x, y: y + 2.2, z: 24, scale: 1 }];
            }
            if (n === 2) {
                return [
                    { x: x - 3.4, y: y + 2.0, z: 23, scale: 1 },
                    { x: x + 3.4, y: y + 2.4, z: 25, scale: 1 }
                ];
            }
            const half = Math.min(6.2, 3.0 + Math.min(n, 10) * 0.32);
            return packTrapezoid(
                n,
                { left: x - half * 0.42, right: x + half * 0.42, y: y + 0.4 },
                { left: x - half, right: x + half, y: y + 5.2 }
            );
        }

        function claimScoreMembers(list, claimed, group) {
            const members = [];
            list.forEach((player, index) => {
                if (claimed.has(index)) return;
                if (!playerMatchesGroup(player, group)) return;
                claimed.add(index);
                members.push(player);
            });
            return members;
        }

        function placeScoreFlock(list, names) {
            const { field, parade } = scoreAnswerModels();
            const claimed = new Set();
            const byPlayer = new Map();
            field.forEach((banner) => {
                const members = claimScoreMembers(list, claimed, banner);
                if (!members.length) return;
                const named = members.length <= SCORE_NAME_AT;
                const packed = packBannerHolders(members.length, banner.x, banner.y);
                members.forEach((player, index) => {
                    const slot = resultSlot(player, names, packed[index], {
                        named,
                        tight: true,
                        minGy: banner.y - 2
                    });
                    slot.mood = 'idle';
                    byPlayer.set(player, slot);
                });
            });
            parade.forEach((group) => {
                const members = claimScoreMembers(list, claimed, group);
                members.forEach((player, index) => {
                    byPlayer.set(player, resultSlot(player, names, {
                        x: PARADE_PARK_X - (index % 5) * 1.4,
                        y: PARADE_Y + (index % 3) * 1.2,
                        z: 40,
                        scale: 1
                    }, {
                        named: false,
                        paradeWait: true,
                        minGy: PARADE_Y - 2
                    }));
                });
            });
            const leftovers = list.filter((_, index) => !claimed.has(index));
            if (leftovers.length) {
                const packed = packTrapezoid(
                    leftovers.length,
                    { left: 1.2, right: 11, y: 56 },
                    { left: 0.6, right: 13, y: 70 }
                );
                leftovers.forEach((player, index) => {
                    byPlayer.set(player, resultSlot(player, names, packed[index], {
                        named: leftovers.length <= SCORE_NAME_AT,
                        scale: 0.84,
                        minGy: 54
                    }));
                });
            }
            return list.map((player) => byPlayer.get(player) || resultSlot(player, names));
        }

        function placeResultsFlock(list, names) {
            if (document.querySelector('.tv-score')) return placeScoreFlock(list, names);
            const graze = packTrapezoid(list.length, RESULTS_FAR, RESULTS_NEAR);
            return list.map((player, index) => {
                const hash = nameHash(player.name || player.id || String(index));
                const g = graze[index] || { x: 50, y: 78, z: 10, scale: 1 };
                return {
                    id: player.stableId || player.id || player.name,
                    name: player.name || 'Sheep',
                    label: flockLabel(player.name || 'Sheep', names),
                    score: Number(player.score) || 0,
                    gx: Math.min(RESULTS_NEAR.right, Math.max(RESULTS_NEAR.left, g.x + ((hash % 5) - 2) * 0.4)),
                    gy: Math.min(RESULTS_NEAR.y, Math.max(RESULTS_FAR.y, g.y + (((hash >> 3) % 5) - 2) * 0.35)),
                    px: 80,
                    py: 70,
                    ox: 60,
                    oy: 70,
                    scale: g.scale,
                    z: g.z,
                    coat: (hash % 2) + 1,
                    idle: ((hash % 17) * 0.18).toFixed(2),
                    mood: (hash % 3 === 0) ? 'eat' : 'idle'
                };
            });
        }

        function placeFlock(players) {
            const list = sortedFlockPlayers(players);
            const names = list.map((p) => p.name || 'Sheep');
            if (document.querySelector('.tv-lobby')) {
                return placeLobbyFlock(list, names);
            }
            if (document.querySelector('.tv-play')) {
                return placePlayFlock(list, names);
            }
            if (isBoardPasture()) {
                return placeResultsFlock(list, names);
            }
            const graze = packRegion(list.length, { left: 4, right: 56, top: 48, bottom: 88 });
            const pen = packRegion(list.length, { left: 70, right: 91, top: 58, bottom: 86 });
            const gate = packRegion(list.length, { left: 56, right: 67, top: 60, bottom: 84 });
            return list.map((player, index) => {
                const hash = nameHash(player.name || player.id || String(index));
                const g = graze[index] || { x: 20, y: 50, z: 10, scale: 1 };
                const p = pen[index] || { x: 80, y: 50, z: 10, scale: 1 };
                const o = gate[index] || { x: 60, y: 70, z: 10, scale: 1 };
                return {
                    id: player.stableId || player.id || player.name,
                    name: player.name || 'Sheep',
                    label: flockLabel(player.name || 'Sheep', names),
                    gx: Math.min(56, Math.max(3, g.x + ((hash % 7) - 3) * 0.35)),
                    gy: Math.min(90, Math.max(46, g.y + (((hash >> 3) % 5) - 2) * 0.7)),
                    px: Math.min(95, Math.max(66, p.x + ((hash % 5) - 2) * 0.2)),
                    py: Math.min(88, Math.max(48, p.y + (((hash >> 4) % 5) - 2) * 0.35)),
                    ox: Math.min(68, Math.max(54, o.x + ((hash % 5) - 2) * 0.25)),
                    oy: Math.min(86, Math.max(56, o.y + (((hash >> 4) % 5) - 2) * 0.3)),
                    scale: g.scale,
                    z: g.z,
                    coat: (hash % 2) + 1,
                    idle: ((hash % 17) * 0.18).toFixed(2),
                    mood: 'idle'
                };
            });
        }

        function answeredLookup(answeredPlayers) {
            const set = new Set();
            (answeredPlayers || []).forEach((entry) => {
                if (typeof entry === 'string') {
                    set.add(entry.toLowerCase());
                    return;
                }
                if (!entry) return;
                if (entry.id) set.add(String(entry.id));
                if (entry.stableId) set.add(String(entry.stableId));
                if (entry.name) set.add(String(entry.name).toLowerCase());
            });
            return set;
        }

        function playerHasAnswered(el, answered) {
            const id = el.dataset.id;
            const name = (el.dataset.name || '').toLowerCase();
            return (id && answered.has(id)) || (name && answered.has(name));
        }

        function eweCaptionHtml(slot) {
            const name = escapeDisplayText(slot.label || slot.name || 'Sheep');
            const score = Number(slot.score);
            const pts = (slot.score != null && Number.isFinite(score))
                ? `<span class="tv-ewe-pts">${score}</span>`
                : '';
            return `<span class="tv-ewe-name">${name}</span>${pts}`;
        }

        function applyEweLook(el, slot) {
            el.classList.toggle('is-crowd', slot.named === false);
            el.classList.toggle('is-parade-wait', !!slot.paradeWait);
            el.classList.toggle('is-parade', !!slot.parade);
        }

        function eweFigureHtml(slot) {
            const crowd = slot.named === false ? ' is-crowd' : '';
            const wait = slot.paradeWait ? ' is-parade-wait' : '';
            return `
                <figure class="tv-ewe${crowd}${wait}" data-id="${escapeDisplayText(slot.id)}" data-name="${escapeDisplayText(slot.name)}" data-coat="${slot.coat}" data-mood="${escapeDisplayText(slot.mood || 'idle')}" style="--gx:${slot.gx}%;--gy:${slot.gy}%;--px:${slot.px}%;--py:${slot.py}%;--ox:${slot.ox}%;--oy:${slot.oy}%;--s:${slot.scale};--z:${slot.z};--idle:${slot.idle}s">
                    ${EWE_ART}
                    <figcaption>${eweCaptionHtml(slot)}</figcaption>
                </figure>
            `;
        }

        function applyEweSlot(el, slot) {
            el.dataset.name = slot.name;
            el.dataset.coat = String(slot.coat);
            el.dataset.mood = slot.mood || 'idle';
            el.style.setProperty('--gx', `${slot.gx}%`);
            el.style.setProperty('--gy', `${slot.gy}%`);
            el.style.setProperty('--px', `${slot.px}%`);
            el.style.setProperty('--py', `${slot.py}%`);
            el.style.setProperty('--ox', `${slot.ox}%`);
            el.style.setProperty('--oy', `${slot.oy}%`);
            el.style.setProperty('--s', String(slot.scale));
            el.style.setProperty('--z', String(slot.z));
            el.style.setProperty('--idle', `${slot.idle}s`);
            const cap = el.querySelector('figcaption');
            if (cap) cap.innerHTML = eweCaptionHtml(slot);
            applyEweLook(el, slot);
        }

        function slotFromEwe(el, overrides) {
            const nameEl = el.querySelector('.tv-ewe-name');
            const ptsEl = el.querySelector('.tv-ewe-pts');
            const score = ptsEl ? Number(ptsEl.textContent) : null;
            return Object.assign({
                id: el.dataset.id,
                name: el.dataset.name,
                label: (nameEl && nameEl.textContent) || (el.querySelector('figcaption') && el.querySelector('figcaption').textContent) || el.dataset.name,
                score: Number.isFinite(score) ? score : undefined,
                gx: parseFloat(el.style.getPropertyValue('--gx')) || 50,
                gy: parseFloat(el.style.getPropertyValue('--gy')) || 64,
                px: parseFloat(el.style.getPropertyValue('--px')) || 80,
                py: parseFloat(el.style.getPropertyValue('--py')) || 70,
                ox: parseFloat(el.style.getPropertyValue('--ox')) || 60,
                oy: parseFloat(el.style.getPropertyValue('--oy')) || 70,
                scale: parseFloat(el.style.getPropertyValue('--s')) || 1,
                z: parseFloat(el.style.getPropertyValue('--z')) || 10,
                coat: Number(el.dataset.coat) || 1,
                idle: parseFloat(el.style.getPropertyValue('--idle')) || 0,
                mood: el.dataset.mood || 'idle'
            }, overrides || {});
        }

        function clearEweWander(el) {
            const t = Number(el.dataset.wanderTimer || 0);
            if (t) window.clearTimeout(t);
            el.dataset.wanderTimer = '';
        }

        function bumpEweWalk(el) {
            const next = String((Number(el.dataset.walkGen) || 0) + 1);
            el.dataset.walkGen = next;
            return next;
        }

        function scheduleLobbyWander(el) {
            clearEweWander(el);
            if (!canPastureWander(el) || !shouldRoam(el)) return;
            const play = isPlayPasture();
            const n = flockSize();
            const wait = play
                ? (9000 + Math.random() * 16000)
                : (4000 + Math.random() * 10000);
            const timer = window.setTimeout(() => {
                if (!canPastureWander(el) || !shouldRoam(el)) return;
                if (el.classList.contains('is-walking') || el.classList.contains('is-joining')) {
                    scheduleLobbyWander(el);
                    return;
                }
                const walkChance = play && n > 24 ? 0.12 : 0.32;
                const walkCap = play ? (n > 60 ? 4 : 8) : 18;
                if (Math.random() > walkChance || walkingCount() >= walkCap) {
                    if (!play && Math.random() < 0.28) {
                        el.dataset.mood = Math.random() < 0.45 ? 'eat' : 'idle';
                    }
                    scheduleLobbyWander(el);
                    return;
                }
                wanderLobbyEwe(el);
            }, wait);
            el.dataset.wanderTimer = String(timer);
        }

        let lobbySnackTimer = 0;
        let lobbySeparateTimer = 0;
        let lastSnackId = '';
        let biteMarkTimer = 0;
        let biteNibbleTimer = 0;
        let biteHealTimer = 0;
        const SNACK_WALK = { cycle: 1.12, minSeconds: 4.4, maxSeconds: 16 };
        const SNACK_SCALE = 1.28;

        function lobbyJoinSign() {
            return document.querySelector('.tv-lobby-join');
        }

        function qrNibbleSpot(el) {
            const chorus = document.getElementById('flockChorus');
            const card = lobbyJoinSign();
            if (!chorus || !card) return { gx: 2, gy: 78 };
            const field = chorus.getBoundingClientRect();
            const art = card.querySelector('.tv-sign-art-whole') || card.querySelector('.tv-sign-art') || card;
            const box = art.getBoundingClientRect();
            if (!field.width || !field.height) return { gx: 2, gy: 78 };
            const currentS = parseFloat((el && el.style.getPropertyValue('--s')) || '1') || 1;
            const drawnW = (el && el.getBoundingClientRect().width) || 110;
            const eweW = drawnW * (SNACK_SCALE / currentS);
            const cornerX = box.left + box.width * 0.93;
            const cornerY = box.top + box.height * 0.80;
            return {
                gx: ((cornerX + eweW * 0.50 - field.left) / field.width) * 100,
                gy: ((cornerY + eweW * 0.14 - field.top) / field.height) * 100
            };
        }

        function stopCardChew() {
            const card = lobbyJoinSign();
            if (card) card.classList.remove('is-nibbled');
        }

        function resetSignBite() {
            const card = lobbyJoinSign();
            if (!card) return;
            card.classList.remove('is-bitten', 'is-bite-1', 'is-bite-2', 'is-healing', 'is-healed', 'is-nibbled');
        }

        function clearSignBiteTimers() {
            window.clearTimeout(biteMarkTimer);
            window.clearTimeout(biteNibbleTimer);
            window.clearTimeout(biteHealTimer);
            biteMarkTimer = 0;
            biteNibbleTimer = 0;
            biteHealTimer = 0;
        }

        function markSignBitten(stage) {
            const card = lobbyJoinSign();
            if (!card || !biteMasksReady) return;
            card.classList.remove('is-healing');
            card.classList.add('is-bitten', stage === 1 ? 'is-bite-1' : 'is-bite-2');
        }

        function healSignBite() {
            const card = lobbyJoinSign();
            if (!card || !card.classList.contains('is-bitten')) return;
            const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            card.classList.add('is-healing');
            biteHealTimer = window.setTimeout(() => {
                card.classList.remove('is-bitten', 'is-bite-1', 'is-bite-2', 'is-healing', 'is-healed');
            }, reduce ? 0 : 6200);
        }

        function armLobbySnack() {
            window.clearTimeout(lobbySnackTimer);
            const lobby = document.querySelector('.tv-lobby');
            if (!lobby) return;
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            lobbySnackTimer = window.setTimeout(tryLobbySnack, 60000);
        }

        function tryLobbySnack() {
            const lobby = document.querySelector('.tv-lobby');
            if (!lobby) return;
            if (document.querySelector('#flockChorus .tv-ewe.is-snackish, #flockChorus .tv-ewe.is-nibbling')) {
                lobbySnackTimer = window.setTimeout(tryLobbySnack, 8000);
                return;
            }
            const pick = pickSnackEwe();
            if (!pick) {
                lobbySnackTimer = window.setTimeout(tryLobbySnack, 8000);
                return;
            }
            startQrNibble(pick);
            armLobbySnack();
        }

        function pickSnackEwe() {
            const ewes = [...document.querySelectorAll('#flockChorus .tv-ewe')].filter((el) =>
                !isLobbyEweBusy(el) && !el.classList.contains('is-walking')
            );
            if (!ewes.length) return null;
            const ranked = ewes
                .map((el) => ({ el, gy: parseFloat(el.style.getPropertyValue('--gy')) || 64 }))
                .sort((a, b) => a.gy - b.gy);
            const notLast = lastSnackId ? ranked.filter((row) => row.el.dataset.id !== lastSnackId) : ranked;
            const pool = notLast.length ? notLast : ranked;
            const farCount = Math.max(1, Math.ceil(pool.length / 2));
            const far = pool.slice(0, farCount);
            return far[Math.floor(Math.random() * far.length)].el;
        }

        function startQrNibble(el) {
            const lobby = document.querySelector('.tv-lobby');
            if (!lobby || !el || !el.isConnected) return;
            const chorus = document.getElementById('flockChorus');
            const card = document.querySelector('.tv-lobby-join');
            if (!chorus || !card || !chorus.getBoundingClientRect().width || !el.getBoundingClientRect().width) {
                window.setTimeout(() => startQrNibble(el), 250);
                return;
            }
            lastSnackId = el.dataset.id || '';
            clearEweWander(el);
            clearSignBiteTimers();
            resetSignBite();
            el.classList.add('is-snackish');
            const spot = qrNibbleSpot(el);
            el.classList.add('is-left');
            walkEweOnField(el, slotFromEwe(el, {
                gx: spot.gx,
                gy: spot.gy,
                scale: SNACK_SCALE,
                z: 80,
                mood: 'idle'
            }), () => {
                if (!el.isConnected || !document.querySelector('.tv-lobby')) return;
                el.classList.add('is-left', 'is-nibbling');
                el.dataset.mood = 'eat';
                const nibbleCard = lobbyJoinSign();
                if (nibbleCard) nibbleCard.classList.add('is-nibbled');
                biteMarkTimer = window.setTimeout(() => markSignBitten(1), 280);
                biteNibbleTimer = window.setTimeout(() => markSignBitten(2), 730);
                window.setTimeout(() => finishQrNibble(el), 5200 + Math.random() * 2800);
            }, SNACK_WALK);
        }

        function finishQrNibble(el) {
            stopCardChew();
            window.clearTimeout(biteHealTimer);
            biteHealTimer = window.setTimeout(healSignBite, 700);
            if (!el || !el.isConnected || !document.querySelector('.tv-lobby')) return;
            el.classList.remove('is-nibbling');
            const away = randomLobbyPoint(occupiedLobbyPoints(el), el);
            const depth = lobbyDepth(away.gy);
            const gx = parseFloat(el.style.getPropertyValue('--gx')) || 30;
            el.classList.toggle('is-left', away.gx < gx);
            walkEweOnField(el, slotFromEwe(el, {
                gx: away.gx,
                gy: away.gy,
                scale: depth.scale,
                z: depth.z,
                mood: Math.random() < 0.4 ? 'eat' : 'idle'
            }), () => {
                el.classList.remove('is-snackish');
                scheduleLobbyWander(el);
            }, SNACK_WALK);
        }

        function wanderLobbyEwe(el) {
            if (!canPastureWander(el)) return;
            const gx = parseFloat(el.style.getPropertyValue('--gx')) || 70;
            const gy = parseFloat(el.style.getPropertyValue('--gy')) || 64;
            const occupied = occupiedLobbyPoints(el);
            let dest = null;
            for (let i = 0; i < 16; i += 1) {
                const trySpot = clampLobbyPoint(gx + (Math.random() - 0.5) * 16, gy + (Math.random() - 0.5) * 12);
                if (spotIsClear(trySpot.gx, trySpot.gy, occupied, el)) {
                    dest = trySpot;
                    break;
                }
            }
            if (!dest) {
                scheduleLobbyWander(el);
                return;
            }
            const depth = lobbyDepth(dest.gy);
            el.classList.toggle('is-left', dest.gx < gx);
            walkEweOnField(el, slotFromEwe(el, {
                gx: dest.gx,
                gy: dest.gy,
                scale: depth.scale,
                z: depth.z
            }), () => scheduleLobbyWander(el));
        }

        function pickIdleMover(els, moved) {
            const idle = els.filter((el) => el && !isLobbyEweBusy(el) && !(moved && moved.has(el)));
            if (!idle.length) return null;
            return idle[Math.floor(Math.random() * idle.length)];
        }

        function separateLobbyEwe(el, opts) {
            if (!el || !el.isConnected || isLobbyEweBusy(el)) return;
            const me = readLobbyEwe(el);
            const occupied = occupiedLobbyPoints(el);
            let dest = null;
            if (opts && opts.line && opts.line.length === 2) {
                const a = opts.line[0];
                const b = opts.line[1];
                const dx = b.x - a.x;
                const dy = b.y - a.y;
                const len = Math.hypot(dx, dy) || 1;
                const side = Math.random() < 0.5 ? 1 : -1;
                const step = clampLobbyPoint(
                    me.gx + (-dy / len) * 11 * side,
                    me.gy + (dx / len) * 8 * side
                );
                if (!lobbySpotCrowded(step.gx, step.gy, occupied, el)) dest = step;
            } else {
                let nearest = null;
                let nearestDist = Infinity;
                occupied.forEach((other) => {
                    const dist = Math.hypot(other.gx - me.gx, (other.gy - me.gy) * 1.2);
                    if (dist < nearestDist) {
                        nearestDist = dist;
                        nearest = other;
                    }
                });
                if (nearest && nearestDist > 0.2) {
                    const step = clampLobbyPoint(
                        me.gx + ((me.gx - nearest.gx) / nearestDist) * 10,
                        me.gy + ((me.gy - nearest.gy) / nearestDist) * 8
                    );
                    if (!lobbySpotCrowded(step.gx, step.gy, occupied, el)) dest = step;
                }
            }
            if (!dest) {
                const field = pastureField();
                for (let i = 0; i < 28; i += 1) {
                    const fallback = clampLobbyPoint(
                        field.left + Math.random() * (field.right - field.left),
                        field.top + Math.random() * (field.bottom - field.top)
                    );
                    if (!lobbySpotCrowded(fallback.gx, fallback.gy, occupied, el)) {
                        dest = fallback;
                        break;
                    }
                }
            }
            if (!dest) {
                scheduleLobbyWander(el);
                return false;
            }
            clearEweWander(el);
            const depth = lobbyDepth(dest.gy);
            el.classList.toggle('is-left', dest.gx < me.gx);
            walkEweOnField(el, slotFromEwe(el, {
                gx: dest.gx,
                gy: dest.gy,
                scale: depth.scale,
                z: depth.z
            }), () => scheduleLobbyWander(el));
            return true;
        }

        function nudgeOverlappingLobbyEwes() {
            const chorus = document.getElementById('flockChorus');
            if (!chorus || !isPastureScene() || isQuietPasture()) return;
            const ewes = roamingEwes();
            if (ewes.length > 40) return;
            const boxes = ewes.map((el) => eweWorldBox(el));
            const moved = new Set();
            for (let i = 0; i < boxes.length; i += 1) {
                for (let j = i + 1; j < boxes.length; j += 1) {
                    if (!boxesOverlap(boxes[i], boxes[j])) continue;
                    const mover = pickIdleMover([ewes[i], ewes[j]], moved);
                    if (!mover) continue;
                    if (separateLobbyEwe(mover)) moved.add(mover);
                }
            }
            if (ewes.length > 18) return;
            const pts = ewes
                .filter((el) => !moved.has(el) && !el.classList.contains('is-walking'))
                .map((el) => eweLinePoint(el));
            let brokeLine = false;
            for (let i = 0; i < pts.length && !brokeLine; i += 1) {
                for (let j = i + 1; j < pts.length && !brokeLine; j += 1) {
                    for (let k = j + 1; k < pts.length && !brokeLine; k += 1) {
                        if (!pointsCollinear(pts[i], pts[j], pts[k])) continue;
                        const mover = pickIdleMover([pts[i].el, pts[j].el, pts[k].el], moved);
                        if (!mover) continue;
                        const line = [pts[i], pts[j], pts[k]].filter((p) => p.el !== mover).slice(0, 2);
                        if (separateLobbyEwe(mover, { line })) {
                            moved.add(mover);
                            brokeLine = true;
                        }
                    }
                }
            }
        }

        function armLobbySeparate() {
            window.clearTimeout(lobbySeparateTimer);
            if (!document.querySelector('.tv-lobby')) return;
            lobbySeparateTimer = window.setTimeout(() => {
                nudgeOverlappingLobbyEwes();

            }, 1400);

        function playJoinJump(el) {
            if (!el) return;
            el.classList.add('is-joining');
            const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (!reduce) {
                el.classList.add('is-poofing');
                const poof = document.createElement('span');
                poof.className = 'tv-ewe-poof';
                poof.setAttribute('aria-hidden', 'true');
                poof.innerHTML = '<i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>';
                el.appendChild(poof);
                window.setTimeout(() => {
                    el.classList.remove('is-poofing');
                    if (poof.parentNode) poof.remove();
                }, 900);
            }
            const done = () => {
                if (!el.classList.contains('is-joining')) return;
                el.classList.remove('is-joining');
                scheduleLobbyWander(el);
            };
            const onEnd = (event) => {
                if (event.animationName && event.animationName !== 'eweJump') return;
                el.removeEventListener('animationend', onEnd);
                done();
            };
            el.addEventListener('animationend', onEnd);
            window.setTimeout(() => {
                el.removeEventListener('animationend', onEnd);
                done();
            }, 700);
        }

        function walkEweOnField(el, slot, onDone, opts) {
            const chorus = document.getElementById('flockChorus');
            const field = (chorus || el).getBoundingClientRect();
            const now = el.getBoundingClientRect();
            const destX = field.left + (slot.gx / 100) * field.width;
            const destY = field.top + (slot.gy / 100) * field.height;
            const dist = Math.hypot(destX - (now.left + now.width / 2), destY - (now.top + now.height * 0.72));
            if (dist < 10) {
                applyEweSlot(el, slot);
                if (onDone) onDone();
                return;
            }
            const cycle = (opts && opts.cycle) || 0.6;
            const stride = (now.width || 56) * 1.25;
            const minSeconds = (opts && opts.minSeconds) || 0.6 * 2;
            const maxSeconds = (opts && opts.maxSeconds) || 8;
            const seconds = Math.min(maxSeconds, Math.max(minSeconds, dist / (stride / cycle)));
            const gen = bumpEweWalk(el);
            el.classList.remove('is-joining');
            el.classList.remove('is-walking');
            el.style.setProperty('--walk', `${seconds.toFixed(2)}s`);
            applyEweSlot(el, slot);
            el.classList.add('is-walking');
            let done = false;
            const finish = (event) => {
                if (el.dataset.walkGen !== gen) return;
                if (event && event.propertyName && event.propertyName !== 'left') return;
                if (done) return;
                done = true;
                el.classList.remove('is-walking');
                el.removeEventListener('transitionend', finish);
                if (onDone) onDone();
            };
            el.addEventListener('transitionend', finish);
            window.setTimeout(finish, seconds * 1000 + 80);
        }

        function syncLobbyFlock(chorus, slots) {
            const byId = new Map();
            chorus.querySelectorAll('.tv-ewe').forEach((el) => byId.set(el.dataset.id, el));
            const keep = new Set();
            slots.forEach((slot) => {
                const id = String(slot.id);
                keep.add(id);
                const el = byId.get(id);
                if (!el) {
                    chorus.insertAdjacentHTML('beforeend', eweFigureHtml(slot));
                    const born = chorus.querySelector(`.tv-ewe[data-id="${CSS.escape(id)}"]`);
                    if (born) playJoinJump(born);
                    return;
                }
                const cap = el.querySelector('figcaption');
                if (cap) cap.innerHTML = eweCaptionHtml(slot);
                applyEweLook(el, slot);
            });
            byId.forEach((el, id) => {
                if (keep.has(id)) return;
                if (el.classList.contains('is-nibbling') || el.classList.contains('is-snackish')) {
                    stopCardChew();
                }
                clearEweWander(el);
                el.remove();
            });
        }

        function renderFlock(players) {
            const chorus = document.getElementById('flockChorus');
            if (!chorus) return;
            const list = sortedFlockPlayers(players);
            const slots = placeFlock(list);
            const roaming = isPastureScene();
            const existing = chorus.querySelectorAll('.tv-ewe').length;
            chorus.dataset.flockKey = flockKey(list);
            chorus.dataset.dense = list.length > 28 ? '1' : '0';
            const nextBase = `${eweBaseSize(list.length)}px`;
            if (roaming) {
                if (existing) {
                    syncLobbyFlock(chorus, slots);
                    if (!isQuietPasture()) {
                        chorus.querySelectorAll('.tv-ewe').forEach(pinEweToGrass);
                        chorus.getBoundingClientRect();
                    }
                    chorus.style.setProperty('--ewe-base', nextBase);
                    if (!isQuietPasture()) window.setTimeout(nudgeOverlappingLobbyEwes, 480);
                    return;
                }
                chorus.style.setProperty('--ewe-base', nextBase);
                chorus.innerHTML = slots.map((slot) => eweFigureHtml(slot)).join('');
                const born = chorus.querySelectorAll('.tv-ewe');
                if (born.length === 1) playJoinJump(born[0]);
                else born.forEach((el) => {
                    if (shouldRoam(el)) scheduleLobbyWander(el);
                });
                return;
            }
            chorus.style.setProperty('--ewe-base', nextBase);
            chorus.dataset.ready = '0';
            chorus.innerHTML = slots.map((slot) => eweFigureHtml(slot)).join('');
        }

        function walkSecondsTo(el, leftVar, topVar) {
            const chorus = document.getElementById('flockChorus');
            const field = (chorus || el).getBoundingClientRect();
            const now = el.getBoundingClientRect();
            const leftPct = parseFloat(el.style.getPropertyValue(`--${leftVar}`)) || 0;
            const topPct = parseFloat(el.style.getPropertyValue(`--${topVar}`)) || 0;
            const destX = field.left + (leftPct / 100) * field.width;
            const destY = field.top + (topPct / 100) * field.height;
            const dist = Math.hypot(destX - (now.left + now.width / 2), destY - (now.top + now.height * 0.72));
            const body = now.width || 56;
            const cycle = 0.6;
            const stride = body * 1.25;
            const seconds = dist / (stride / cycle);
            return Math.min(8, Math.max(cycle * 2, seconds));
        }

        function moveEwe(el, next, skipWalk) {
            clearEweWander(el);
            const gen = bumpEweWalk(el);
            const destLeft = next.outside ? 'ox' : 'px';
            const destTop = next.outside ? 'oy' : 'py';
            if (!skipWalk && isPlayPasture() && walkingCount() >= 8) skipWalk = true;
            const seconds = skipWalk ? 0 : walkSecondsTo(el, destLeft, destTop);
            el.classList.remove('is-walking');
            if (!skipWalk) el.style.setProperty('--walk', `${seconds.toFixed(2)}s`);
            const fromX = parseFloat(el.style.getPropertyValue('--gx')) || 0;
            const toX = parseFloat(el.style.getPropertyValue(`--${destLeft}`)) || 0;
            el.classList.toggle('is-left', toX < fromX);
            el.classList.toggle('is-outside', !!next.outside);
            el.classList.toggle('is-in', !!next.inside);
            const destGy = parseFloat(el.style.getPropertyValue(`--${destTop}`)) || 70;
            const destDepth = lobbyDepth(destGy);
            el.style.setProperty('--s', String(destDepth.scale));
            el.style.setProperty('--z', String(Math.min(64, destDepth.z + (next.inside ? 6 : 0))));
            if (skipWalk) {
                el.classList.add('is-placed');
                requestAnimationFrame(() => el.classList.remove('is-placed'));
                return;
            }
            el.classList.add('is-walking');
            let done = false;
            const finish = (event) => {
                if (el.dataset.walkGen !== gen) return;
                if (event && event.propertyName && event.propertyName !== 'left') return;
                if (done) return;
                done = true;
                el.classList.remove('is-walking');
                el.removeEventListener('transitionend', finish);
            };
            el.addEventListener('transitionend', finish);
            window.setTimeout(finish, seconds * 1000 + 80);
        }

        function paintFlock(answeredPlayers, instant, sentBackPlayers) {
            const chorus = document.getElementById('flockChorus');
            const answered = answeredLookup(answeredPlayers);
            const sentBack = answeredLookup(sentBackPlayers);
            const skipWalk = instant || (chorus && chorus.dataset.ready !== '1');
            document.querySelectorAll('#flockChorus .tv-ewe').forEach((el) => {
                const wantsOut = playerHasAnswered(el, sentBack);
                const wantsIn = !wantsOut && playerHasAnswered(el, answered);
                const isOut = el.classList.contains('is-outside');
                const isIn = el.classList.contains('is-in');
                if (wantsOut === isOut && wantsIn === isIn) return;
                if (wantsOut) {
                    moveEwe(el, { outside: true, inside: false }, skipWalk);
                } else if (wantsIn) {
                    moveEwe(el, { outside: false, inside: true }, skipWalk);
                } else {
                    el.classList.remove('is-in', 'is-outside', 'is-walking');
                    const grazeGy = parseFloat(el.style.getPropertyValue('--gy')) || 70;
                    const grazeDepth = lobbyDepth(grazeGy);
                    el.style.setProperty('--s', String(grazeDepth.scale));
                    el.style.setProperty('--z', String(grazeDepth.z));
                }
            });
            if (chorus) chorus.dataset.ready = '1';
            const inCount = document.querySelectorAll('#flockChorus .tv-ewe.is-in').length;
            const total = document.querySelectorAll('#flockChorus .tv-ewe').length;
            const inEl = document.getElementById('flockInCount');
            const outEl = document.getElementById('flockOutCount');
            if (inEl) inEl.textContent = String(inCount);
            if (outEl) outEl.textContent = String(Math.max(0, total - inCount));
            return { inCount, total };
        }

            const perRound = gameState.questionsPerRound || 1;
            const roundNumber = Math.ceil(questionNumber / perRound);

            document.getElementById('displayScreen').innerHTML = `

            renderFlock(gameState.players);

        function updateDisplayTimer(timeLeft) {
            const timerText = document.getElementById('displayTimer');
            const timerCircle = document.getElementById('timerCircle');
            
            if (!timerText || !timerCircle) return;
            
            // Add tick animation for countdown effect
            timerText.classList.add('tick');
            setTimeout(() => timerText.classList.remove('tick'), 300);
            
            // Update timer display
            timerText.textContent = timeLeft;
            
            timerCircle.classList.remove('urgent', 'warning');
            if (timeLeft <= 5) {
                timerCircle.classList.add('urgent');
            } else if (timeLeft <= 10) {
                timerCircle.classList.add('warning');
            }
            
            // Update gameState for consistency
            if (gameState) {
                gameState.timeLeft = timeLeft;
            }
        }
        
        function updateResponseIndicator(responses, totalPlayers, answeredPlayers) {
            const responseText = document.getElementById('responseText');
            const chorus = document.getElementById('flockChorus');
            if (!chorus && !responseText) return;

            if (answeredPlayers && gameState) gameState.answeredPlayers = answeredPlayers;
            const players = (gameState && gameState.players) || [];
            const total = Number(totalPlayers) || players.length || 0;
            if (chorus && chorus.dataset.flockKey !== flockKey(players)) {
                renderFlock(players);
            }
            const rebuilt = chorus && chorus.dataset.ready !== '1';
            const painted = paintFlock(
                (gameState && gameState.answeredPlayers) || answeredPlayers || [],
                rebuilt,
                (gameState && gameState.sentBackPlayers) || []
            );
            const inCount = painted ? painted.inCount : (Number(responses) || 0);
            const flockTotal = painted ? painted.total : total;
            if (responseText) responseText.textContent = flockResponseLine(inCount, flockTotal);
        }

            const chorus = document.getElementById('flockChorus');
            const names = ((gameState && gameState.players) || []).map((player) => player.name || 'Sheep');
            const members = ((gameState && gameState.players) || [])

                const id = String(player.stableId || player.id || player.name);
                return chorus && chorus.querySelector(`.tv-ewe[data-id="${CSS.escape(id)}"]`);
            }).filter(Boolean);
            const banner = scoreBannerEl(group);
            const seconds = 6.4;
            const finish = () => {
                parkParadeEwes(els);
                parkScoreBanner(banner);
                if (onDone) onDone();
            };
            if (banner) {
                banner.classList.remove('is-parade-wait');
                banner.classList.add('is-parade', 'is-placed');
                setScoreBannerPos(banner, PARADE_START_X, PARADE_Y, 0);
            }
            const startWalk = (move) => {
                window.requestAnimationFrame(() => {
                    window.requestAnimationFrame(() => {
                        if (gen !== scoreParadeGen) return;
                        move();
                    });
                });
            };
            if (!els.length) {
                if (!banner) {
                    if (onDone) onDone();
                    return;
                }
                startWalk(() => {
                    banner.classList.remove('is-placed');
                    setScoreBannerPos(banner, PARADE_END_X, PARADE_Y, seconds);
                    window.setTimeout(() => {
                        if (gen !== scoreParadeGen) return;
                        finish();
                    }, seconds * 1000 + 80);
                });
                return;
            }
            const start = packBannerHolders(els.length, PARADE_START_X, PARADE_Y);
            const dest = packBannerHolders(els.length, PARADE_END_X, PARADE_Y);
            let left = els.length;
            const finishOne = () => {
                left -= 1;
                if (left > 0) return;
                finish();
            };
            els.forEach((el, index) => {
                const startSlot = resultSlot(members[index], names, start[index], {
                    named: false,
                    parade: true,
                    tight: true,
                    minGy: PARADE_Y - 2
                });
                el.classList.add('is-placed');
                applyEweSlot(el, startSlot);
                el.classList.remove('is-parade-wait', 'is-left');
                el.classList.add('is-parade', 'is-crowd');
            });
            startWalk(() => {
                if (banner) {
                    banner.classList.remove('is-placed');
                    setScoreBannerPos(banner, PARADE_END_X, PARADE_Y, seconds);
                }
                els.forEach((el, index) => {
                    const destSlot = resultSlot(members[index], names, dest[index], {
                        named: false,
                        parade: true,
                        tight: true,
                        minGy: PARADE_Y - 2
                    });
                    el.classList.remove('is-placed');
                    walkEweOnField(el, destSlot, finishOne, { minSeconds: seconds, maxSeconds: seconds });
                });
            });
        }
