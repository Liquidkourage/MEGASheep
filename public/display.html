        function paradeBannerWidth(group, count) {
            const n = Math.max(1, Number(count) || 1);
            const letters = String((group && group.answer) || '').length;
            if (n === 1) return Math.min(16.5, Math.max(9.6, 4.2 + letters * 1.35));
            return Math.min(26, Math.max(20, 18 + Math.min(n, 8) * 0.7, 12 + letters * 0.9));
        }

        function paradeTravel(width, n) {
            const w = Number(width) || 10;
            if (n === 1) {
                const pad = Math.max(18, w * 0.72);
                return { startX: -pad, destX: 100 + pad };
            }
            const pad = Math.max(22, w * 0.78);
            return { startX: -pad, destX: 100 + pad };
        }

        function packFlagHolders(count, cx, cy, width, laneScale, zBase) {
            const n = Math.max(1, count);
            const s = Number(laneScale) || 1;
            const bannerZ = Number(zBase) || 40;
            if (n === 1) return [{ x: cx, y: cy, z: bannerZ + 8, scale: 1.1 * s, tagPlace: 'under' }];
            const half = Math.max(5.4, Number(width) * 0.44);
            const slots = [
                { x: cx - half, y: cy, z: bannerZ + 8, scale: 1.08 * s, tagPlace: 'under' },
                { x: cx + half, y: cy, z: bannerZ + 8, scale: 1.08 * s, tagPlace: 'under' }
            ];
            const extras = n - 2;
            for (let i = 0; i < extras; i += 1) {
                const t = extras === 1 ? 0.5 : (i + 1) / (extras + 1);
                slots.push({
                    x: cx - half + t * half * 2,
                    y: cy + 1.15,
                    z: bannerZ + 5,
                    scale: 0.94 * s,
                    tagPlace: 'hide'
                });
            }
            return slots;
        }

        function setParadeBanner(lane, group, x, y, width, walk, wait, depthLane, depthCount, rosterNames) {
            const el = paradeBannerEl(lane);
            if (!el) return;
            const n = Number((group && group.count) || 0);
            const word = (group && group.answer) || '';
            const pts = String(Number((group && group.points) || 0));
            const extras = Array.isArray(rosterNames) ? rosterNames : extraParadeNames(group);
            const dLane = depthLane == null ? lane : depthLane;
            const dCount = Math.max(1, depthCount == null ? Number(el.dataset.lanes) || PARADE_LANES : depthCount);
            if (wait) el.classList.add('is-parade-wait');
            el.dataset.answer = word;
            el.dataset.holders = String(n);
            el.classList.toggle('is-pennant', n === 1);
            el.classList.toggle('is-cloth', n !== 1);
            el.classList.toggle('has-roster', extras.length > 0);
            el.classList.add('is-parade', 'is-hit');
            el.style.setProperty('--x', `${Number(x).toFixed(2)}%`);
            el.style.setProperty('--y', `${Number(y).toFixed(2)}%`);
            el.style.setProperty('--mx', Number(x).toFixed(2));
            el.style.setProperty('--my', Number(y).toFixed(2));
            el.style.setProperty('--w', `${Number(width).toFixed(2)}vw`);
            el.style.setProperty('--z', String(paradeLaneZ(dLane, dCount)));
            el.style.setProperty('--walk', `${Number(walk || 0).toFixed(2)}s`);
            el.style.transitionDuration = walk ? `${Number(walk).toFixed(2)}s` : '';
            const faceWord = el.querySelector('.tv-flag-face .tv-post-answer');
            const facePts = el.querySelector('.tv-flag-face .tv-post-pts');
            if (faceWord && faceWord.textContent !== word) faceWord.textContent = word;
            if (facePts && facePts.textContent !== pts) facePts.textContent = pts;
            if (faceWord) window.requestAnimationFrame(() => fitBannerAnswer(faceWord));
            const roster = el.querySelector('.tv-banner-roster');
            if (roster) {
                const html = extras.map((name) => `<span>${escapeDisplayText(name)}</span>`).join('');
                if (roster.innerHTML !== html) roster.innerHTML = html;

            if (!wait) el.classList.remove('is-parade-wait');
        }

        function parkParadeEwes(els) {
            const names = ((gameState && gameState.players) || []).map((player) => player.name || 'Sheep');
            els.forEach((el, index) => {
                const slot = resultSlot({

        }

        function paradeScoreGroup(group, gen, bannerLane, depthLane, depthCount, onDone) {
            if (gen !== scoreParadeGen || !document.querySelector('.tv-score')) {
                if (onDone) onDone();
                return;
            }
            const lanes = Math.max(1, Number(depthCount) || 1);
            const lane = Number(depthLane) || 0;
            const chorus = document.getElementById('flockChorus');
            const names = ((gameState && gameState.players) || []).map((player) => player.name || 'Sheep');
            const members = ((gameState && gameState.players) || []).filter((player) => playerMatchesGroup(player, group));
            const els = members.map((player) => {
                const id = String(player.stableId || player.id || player.name);
                return chorus && chorus.querySelector(`.tv-ewe[data-id="${CSS.escape(id)}"]`);
            }).filter(Boolean);
            const n = Math.max(1, els.length || members.length || 1);
            const laneY = paradeLaneY(lane, lanes);
            const laneScale = paradeLaneScale(lane, lanes);
            const laneZ = paradeLaneZ(lane, lanes);
            const tagPlaceFor = (index, packed) => {
                return (packed[index] || packed[0] || {}).tagPlace || 'under';
            };
            const width = paradeBannerWidth(group, n) * (0.94 + 0.06 * (1 - paradeLaneT(lane, lanes)));
            const { startX, destX } = paradeTravel(width, n);
            const start = packFlagHolders(n, startX, laneY, width, laneScale, laneZ);
            const dest = packFlagHolders(n, destX, laneY, width, laneScale, laneZ);
            const seconds = n === 1 ? 8.4 : 9.6;
            const minGy = Math.max(72, laneY - 6);
            const banner = paradeBannerEl(bannerLane);
            const extras = extraParadeNames(group, members);
            const paint = (x, walk, wait) => setParadeBanner(bannerLane, group, x, laneY, width, walk, wait, lane, lanes, extras);
            let finished = false;
            const startedAt = performance.now();
            const finish = () => {
                if (finished) return;
                if (performance.now() - startedAt < seconds * 1000 - 400) return;
                finished = true;
                parkParadeEwes(els);
                paint(destX, 0, true);
                if (onDone) onDone();
            };
            if (banner) {
                banner.classList.add('is-placed');
                paint(startX, 0, false);
                banner.getBoundingClientRect();
            }
            const armWalk = (onGo) => {
                window.requestAnimationFrame(() => {
                    if (gen !== scoreParadeGen) return;
                    if (banner) banner.getBoundingClientRect();
                    if (els[0]) els[0].getBoundingClientRect();
                    window.requestAnimationFrame(() => {
                        if (gen !== scoreParadeGen) return;
                        const dur = `${seconds.toFixed(2)}s`;
                        if (banner) {
                            banner.classList.remove('is-placed');
                            banner.style.setProperty('--walk', dur);
                            banner.style.transitionDuration = dur;
                        }
                        els.forEach((el) => {
                            el.classList.remove('is-placed');
                            el.style.setProperty('--walk', dur);
                            el.style.transitionDuration = dur;
                        });
                        onGo();
                    });
                });
            };
            if (!els.length) {
                armWalk(() => {
                    paint(destX, seconds, false);
                    window.setTimeout(finish, seconds * 1000 + 80);
                });
                return;
            }
            let left = els.length;
            const finishOne = () => {
                left -= 1;
                if (left > 0) return;
                finish();
            };
            els.forEach((el, index) => {
                const startSlot = resultSlot(members[index], names, start[index] || start[0], {
                    named: true,
                    parade: true,
                    minGy,
                    tagPlace: tagPlaceFor(index, start)
                });
                el.classList.add('is-placed');
                applyEweSlot(el, startSlot);
                el.classList.remove('is-parade-wait', 'is-left', 'is-crowd');
                el.classList.add('is-parade', 'is-walking');
            });
            if (els[0]) els[0].getBoundingClientRect();
            window.setTimeout(finish, seconds * 1000 + 80);
            armWalk(() => {
                paint(destX, seconds, false);
                els.forEach((el, index) => {
                    const destSlot = resultSlot(members[index], names, dest[index] || dest[0], {
                        named: true,
                        parade: true,
                        minGy,
                        tagPlace: tagPlaceFor(index, dest)
                    });
                    walkEweOnField(el, destSlot, finishOne, {
                        seconds,
                        minSeconds: seconds,
                        maxSeconds: seconds,
                        keepStride: true
                    });
                });
            });
        }

        function paradeSetSize(group) {
            return Math.max(1, Number(group && group.count) || ((group && group.players) || []).length || 1);
        }

        function paradeWaves(hits) {
            const sorted = (hits || []).slice().sort((a, b) => {
                const byCount = paradeSetSize(a) - paradeSetSize(b);
                if (byCount) return byCount;
                const byPts = (Number(b.points) || 0) - (Number(a.points) || 0);
                if (byPts) return byPts;
                return String(a.answer || '').localeCompare(String(b.answer || ''));
            });
            const waves = [];
            sorted.forEach((group) => {
                const size = paradeSetSize(group);
                const last = waves[waves.length - 1];
                if (!last || last.size !== size) waves.push({ size, groups: [group] });
                else last.groups.push(group);
            });
            return waves;
        }

        function startScoreParade() {
            const gen = scoreParadeGen;
            const waves = paradeWaves(scoreAnswerModels().hits);
            if (!waves.length) return;
            const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const bannerCount = document.querySelectorAll('[id^="scoreParadeBanner-"]').length || PARADE_LANES;
            const busy = new Set();
            const acquireBanner = () => {
                for (let i = 0; i < bannerCount; i += 1) {
                    if (!busy.has(i) && paradeBannerEl(i)) {
                        busy.add(i);
                        return i;
                    }
                }
                return -1;
            };
            const runWave = (waveIndex) => {
                if (gen !== scoreParadeGen || !document.querySelector('.tv-score')) return;
                const wave = waves[waveIndex];
                if (!wave) {
                    const waitClear = () => {
                        if (gen !== scoreParadeGen || !document.querySelector('.tv-score')) return;
                        if (busy.size) {
                            window.setTimeout(waitClear, 200);
                            return;
                        }
                        window.setTimeout(() => runWave(0), 450);
                    };
                    waitClear();
                    return;
                }
                const groups = wave.groups.slice();
                const depthCount = paradeRowCount(groups.length);
                const stagger = wave.size === 1 ? 880 : 1700;
                let next = 0;
                let closed = false;
                const finishWave = () => {
                    if (closed) return;
                    closed = true;
                    window.setTimeout(() => runWave(waveIndex + 1), 280);
                };
                const launchOne = (depthLane) => {
                    if (gen !== scoreParadeGen || !document.querySelector('.tv-score')) return;
                    if (next >= groups.length) return;
                    const bannerLane = acquireBanner();
                    if (bannerLane < 0) {
                        window.setTimeout(() => launchOne(depthLane), 160);
                        return;
                    }
                    const group = groups[next];
                    next += 1;
                    if (next >= groups.length) {
                        window.setTimeout(finishWave, wave.size === 1 ? 2400 : 2800);
                    }
                    const release = () => {
                        busy.delete(bannerLane);
                    };
                    if (reduce) {
                        const n = paradeSetSize(group);
                        const parked = 16 + depthLane * 18;
                        setParadeBanner(bannerLane, group, parked, paradeLaneY(depthLane, depthCount), paradeBannerWidth(group, n), 0, false, depthLane, depthCount);
                        window.setTimeout(() => {
                            setParadeBanner(bannerLane, group, parked, paradeLaneY(depthLane, depthCount), paradeBannerWidth(group, n), 0, true, depthLane, depthCount);
                            release();
                        }, 2400);
                        return;
                    }
                    paradeScoreGroup(group, gen, bannerLane, depthLane, depthCount, release);
                };
                groups.forEach((_, index) => {
                    window.setTimeout(() => launchOne(index % depthCount), 50 + index * stagger);
                });
            };
            runWave(0);
        }

        function modifyAnswerForGrading(answer) {
            // Add slight variations to correct answers for manual grading practice
            const variations = [
                answer + '!',
                answer + '?',
                answer + '...',
                answer + ' (I think)',
                answer + ' maybe',
                answer.toLowerCase(),
                answer.toUpperCase(),
                answer.charAt(0).toUpperCase() + answer.slice(1).toLowerCase()

            const container = document.getElementById(scrollId);

            const content = container.querySelector('.auto-scroll-content');
            if (!content) return;
            const extra = content.scrollHeight - container.clientHeight;
            if (extra <= 8) return;
            const pct = Math.min(72, Math.max(28, Math.round((extra / content.scrollHeight) * 100)));
            const baseTime = Math.max(playerCount * 1.0, 10);
            const totalCycleTime = baseTime / 1.5;
            content.style.setProperty('--scroll-to', `-${pct}%`);
            content.style.animation = `autoScrollDown ${totalCycleTime}s ease-in-out infinite`;
        }

        function generatePlayerAnswersDisplay(playerAnswers, answerGroups, roundData) {
            if (!playerAnswers || playerAnswers.length === 0) {

            }
            
            console.log('generatePlayerAnswersDisplay - Player answers:', playerAnswers);
            console.log('generatePlayerAnswersDisplay - Answer groups:', answerGroups);
            console.log('generatePlayerAnswersDisplay - Round data:', roundData);
            
            let html = '<div class="player-answers-row">';
            
            // For single player games, use the answer groups directly since they represent the actual answers
            if (roundData.players && roundData.players.length === 1) {
                answerGroups.forEach((group, index) => {
                    const points = group.points;
                    const isCorrect = points > 0;
                    const answer = group.answer;
                    
                    console.log(`✅ Using answer group ${index}: "${answer}" - points=${points}, isCorrect=${isCorrect}`);
                    
                    const statusClass = isCorrect ? 'correct-answer' : 'wrong-answer';
                    
                    // Determine text size based on answer length
                    let textSizeClass = 'medium';
                    if (answer.length <= 8) {
                        textSizeClass = 'short';
                    } else if (answer.length <= 15) {
                        textSizeClass = 'medium';
                    } else if (answer.length <= 25) {
                        textSizeClass = 'long';
                    } else {
                        textSizeClass = 'very-long';
                    }
                    
                    html += `
                        <div class="answer-card-small ${statusClass}" data-answer-length="${textSizeClass}">
                            <span class="answer-text-small">${answer}</span>
                            <span class="answer-points-small">${points}</span>
                        </div>
                    `;
                });
            } else {
                // If entries include points (authoritative), render directly; else use legacy matching fallback
                if (Array.isArray(playerAnswers) && playerAnswers.length && typeof playerAnswers[0] === 'object' && 'points' in playerAnswers[0]) {
                    playerAnswers.forEach(entry => {
                        const isCorrect = Number(entry.points||0) > 0;
                        const statusClass = isCorrect ? 'correct-answer' : 'wrong-answer';
                        const answer = String(entry.answer || '---');
                        const points = Number(entry.points || 0);
                        let textSizeClass = 'medium';
                        if (answer.length <= 8) textSizeClass = 'short';
                        else if (answer.length <= 15) textSizeClass = 'medium';
                        else if (answer.length <= 25) textSizeClass = 'long';
                        else textSizeClass = 'very-long';
                        html += `
                            <div class="answer-card-small ${statusClass}" data-answer-length="${textSizeClass}">
                                <span class="answer-text-small">${answer}</span>
                                <span class="answer-points-small">${points}</span>
                            </div>
                        `;
                    });
                } else {
                playerAnswers.forEach((answer, index) => {
                    let points = 0;
                    let isCorrect = false;
                    const normalizedPlayerAnswer = answer.toString().toLowerCase().trim();
                    const candidateBucketId = normalizedPlayerAnswer.startsWith('correct_') ? normalizedPlayerAnswer : `correct_${normalizedPlayerAnswer.replace(/\s+/g,'_')}`;
                    
                    // Find the answer group that matches this player's answer
                    const answerGroup = answerGroups.find(group => {
                        const normalizedGroupAnswer = group.answer.toString().toLowerCase().trim();
                        const groupBucketId = (group.bucketId || '').toString().toLowerCase().trim();
                        
                        // Prefer bucketId match
                        if (groupBucketId && groupBucketId === candidateBucketId) {
                            return true;
                        }
                        
                        // Exact text match
                        if (normalizedGroupAnswer === normalizedPlayerAnswer) {
                            return true;
                        }

                        // Partial match: player answer contained in group answer
                        if (normalizedGroupAnswer.includes(normalizedPlayerAnswer)) {
                            return true;
                        }
                        
                        // Reverse partial match: group answer contained in player answer
                        if (normalizedPlayerAnswer.includes(normalizedGroupAnswer)) {
                            return true;
                        }
                        
                        return false;
                    });
                    
                    if (answerGroup) {
                        points = answerGroup.points;
                        isCorrect = points > 0;
                        console.log(`✅ Found answer group for "${answer}": points=${points}, isCorrect=${isCorrect}`);
                    } else {
                        console.log(`❌ No answer group found for "${answer}"`);
                    }
                    
                    const statusClass = isCorrect ? 'correct-answer' : 'wrong-answer';
                    
                    // Determine text size based on answer length
                    let textSizeClass = 'medium';
                    if (answer.length <= 8) {
                        textSizeClass = 'short';
                    } else if (answer.length <= 15) {
                        textSizeClass = 'medium';
                    } else if (answer.length <= 25) {
                        textSizeClass = 'long';
                    } else {
                        textSizeClass = 'very-long';
                    }
                    
                    html += `
                        <div class="answer-card-small ${statusClass}" data-answer-length="${textSizeClass}">
                            <span class="answer-text-small">${answer}</span>
                            <span class="answer-points-small">${points}</span>
                        </div>
                    `;
                });
                }
            }
            
            html += '</div>';
            return html;
        }

        function categorizeAnswersForDisplay() {
            // Use current question-specific data to avoid persistence issues
            const currentQuestionIndex = gameState.currentQuestion;
            const submittedAnswers = gameState.currentAnswerGroups || [];
            const correctAnswers = gameState.currentQuestionData?.correct_answers || [];
            const wrongAnswers = [];
            const correctNotGiven = [];
            
            console.log('Categorizing answers for question:', currentQuestionIndex);
            console.log('Current answer groups:', submittedAnswers);
            console.log('Correct answers for this question:', correctAnswers);
            
            // Create a set of submitted answer texts (normalized)
            const submittedTexts = new Set();
            submittedAnswers.forEach(group => {
                // Prefer bucketId to avoid display-name mismatches (e.g., correct_un -> "un")
                const key = (group.bucketId || group.answer).toString().toLowerCase().trim();
                submittedTexts.add(key.startsWith('correct_') ? key : key);
            });
            
            // Separate correct answers that weren't submitted
            correctAnswers.forEach(correctAnswer => {
                const normalized = correctAnswer.toLowerCase().trim();
                const bucketKey = normalized.startsWith('correct_') ? normalized : `correct_${normalized.replace(/\s+/g,'_')}`;
                if (!submittedTexts.has(bucketKey) && !submittedTexts.has(normalized)) {
                    correctNotGiven.push(correctAnswer);
                }
            });
            
            // Separate wrong answers (those with 0 points) - only for current question
            submittedAnswers.forEach(group => {
                if (group.points === 0) {
                    wrongAnswers.push(group);
                }
            });
            
            // Filter submitted answers to only correct ones (points > 0)
            const correctSubmitted = submittedAnswers.filter(group => group.points > 0);
            
            console.log('Categorized - Correct submitted:', correctSubmitted.length, 'Wrong:', wrongAnswers.length, 'Correct not given:', correctNotGiven.length);
            
            return {
                submittedAnswers: correctSubmitted,
                correctNotGiven: correctNotGiven,
                wrongAnswers: wrongAnswers
            };
        }

                        return `
                            <div class="correct-answer-badge" data-answer-length="${textSizeClass}">
                                <div class="correct-answer-text">${answer}</div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
            
            return html;
        }

        function generateWrongAnswersDisplay(wrongAnswers) {
            if (!wrongAnswers || wrongAnswers.length === 0) {
                return '<p class="no-answers">No wrong answers submitted.</p>';
            }
            
            return `
                <div class="wrong-answers-grid">
                    ${wrongAnswers.map(group => `
                        <div class="wrong-answer-card">
                            <div class="wrong-answer-text">${group.answer}</div>
                            <div class="wrong-answer-count">${group.count} player${group.count !== 1 ? 's' : ''}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function calculateDynamicScaling() {
            document.documentElement.style.setProperty('--scale-factor', '1');
            document.documentElement.style.setProperty('--font-scale', '1');
        }

        window.addEventListener('resize', () => {
            if (gameState && gameState.gameState === 'waiting') {
                layoutLobbyPlayers();
            }
            if (document.querySelector('.tv-play')) fitPlayPrompt();
            document.querySelectorAll('.tv-score .tv-flag-face .tv-post-answer').forEach(fitBannerAnswer);
        });

        function generateRoundHistoryDisplay(roundHistory) {
            if (!roundHistory || roundHistory.length === 0) {
                return '<p>No rounds completed yet.</p>';
            }
            
            let html = '<div class="round-history-list">';
            
            roundHistory.forEach((round, index) => {
                const roundNumber = round.roundNumber;
                const questionRange = `Questions ${round.questionStart} - ${round.questionEnd}`;
                const sortedPlayers = [...round.players].sort((a, b) => b.score - a.score);
                
                html += `
                    <div class="round-history-item">
                        <div class="round-header">
                            <h4>Round ${roundNumber}</h4>
                            <span class="round-range">${questionRange}</span>
                        </div>
                        <div class="round-scores">
                            ${sortedPlayers.map((player, playerIndex) => `
                                <div class="round-player-score ${playerIndex < 3 ? `rank-${playerIndex + 1}` : ''}">
                                    <span class="player-name">${player.name}</span>
                                    <span class="player-score">${player.score} pts</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            return html;
        }
    </script>
</body>
</html>
