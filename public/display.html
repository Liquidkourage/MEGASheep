        function eweFigureHtml(slot) {
            const crowd = slot.named === false && !slot.wrong ? ' is-crowd' : '';
            const wait = slot.paradeWait ? ' is-parade-wait' : '';
            const parade = slot.parade ? ' is-parade' : '';
            const wrong = slot.wrong ? ' is-wrong' : '';
            const sad = slot.sad ? ' is-sad' : '';
            const tagHide = slot.parade && slot.tagPlace === 'hide' ? ' is-tag-hide' : '';
            const face = slot.faceLeft && !slot.parade && !slot.paradeWait ? ' is-left' : '';
            return `
                <figure class="tv-ewe${crowd}${wait}${parade}${wrong}${sad}${tagHide}${face}" data-id="${escapeDisplayText(slot.id)}" data-name="${escapeDisplayText(slot.name)}" data-coat="${slot.coat}" data-mood="${escapeDisplayText(slot.mood || 'idle')}" style="--gx:${slot.gx};--gy:${slot.gy};--px:${slot.px};--py:${slot.py};--ox:${slot.ox};--oy:${slot.oy};--s:${slot.scale};--z:${slot.z};--idle:${slot.idle}s">
                    ${EWE_ART}
                    <figcaption>${eweCaptionHtml(slot)}</figcaption>
                </figure>
            `;
        }

        function applyEweSlot(el, slot) {
            if (el.classList.contains('tv-dog')) {
                el.style.setProperty('--gx', String(slot.gx));
                el.style.setProperty('--gy', String(slot.gy));
                el.style.setProperty('--s', String(slot.scale));
                el.style.setProperty('--z', String(slot.z));
                return;
            }
            el.dataset.name = slot.name;
            el.dataset.coat = String(slot.coat);
            el.dataset.mood = slot.mood || 'idle';
            el.style.setProperty('--gx', String(slot.gx));
            el.style.setProperty('--gy', String(slot.gy));
            el.style.setProperty('--px', String(slot.px));
            el.style.setProperty('--py', String(slot.py));
            el.style.setProperty('--ox', String(slot.ox));
            el.style.setProperty('--oy', String(slot.oy));
            el.style.setProperty('--s', String(slot.scale));
            el.style.setProperty('--z', String(slot.z));
            el.style.setProperty('--idle', `${slot.idle}s`);
            const cap = el.querySelector('figcaption');
            if (cap) cap.innerHTML = eweCaptionHtml(slot);
            applyEweLook(el, slot);
        }

        function slotFromEwe(el, overrides) {
            const nameEl = el.querySelector('.tv-ewe-name');
            const ptsEl = el.querySelector('.tv-ewe-pts');
            const score = ptsEl ? Number(ptsEl.textContent) : null;
            return Object.assign({
                id: el.dataset.id,
                name: el.dataset.name,
                label: (nameEl && nameEl.textContent) || (el.querySelector('figcaption') && el.querySelector('figcaption').textContent) || el.dataset.name,
                score: Number.isFinite(score) ? score : undefined,
                gx: parseFloat(el.style.getPropertyValue('--gx')) || 50,
                gy: parseFloat(el.style.getPropertyValue('--gy')) || 64,
                px: parseFloat(el.style.getPropertyValue('--px')) || 80,
                py: parseFloat(el.style.getPropertyValue('--py')) || 70,
                ox: parseFloat(el.style.getPropertyValue('--ox')) || 60,
                oy: parseFloat(el.style.getPropertyValue('--oy')) || 70,
                scale: parseFloat(el.style.getPropertyValue('--s')) || 1,
                z: parseFloat(el.style.getPropertyValue('--z')) || 10,
                coat: Number.isFinite(Number(el.dataset.coat)) ? Number(el.dataset.coat) : (el.dataset.coat || 1),
                idle: parseFloat(el.style.getPropertyValue('--idle')) || 0,
                mood: el.dataset.mood || 'idle',
                sad: el.classList.contains('is-sad')
            }, overrides || {});
        }

        function clearEweWander(el) {
            const t = Number(el.dataset.wanderTimer || 0);
            if (t) window.clearTimeout(t);
            el.dataset.wanderTimer = '';
        }

        function bumpEweWalk(el) {
            const next = String((Number(el.dataset.walkGen) || 0) + 1);
            el.dataset.walkGen = next;
            return next;
        }

        function onWalkFinished(el, gen, seconds, callback) {
            let done = false;
            const started = performance.now();
            const minMs = Math.max(160, seconds * 1000 * 0.55);
            const finish = (event) => {
                if (el.dataset.walkGen !== gen) return;
                if (event && event.propertyName && event.propertyName !== 'left') return;
                if (event && (performance.now() - started) < minMs) return;
                if (done) return;
                done = true;
                el.removeEventListener('transitionend', finish);
                callback();
            };
            el.addEventListener('transitionend', finish);
            window.setTimeout(finish, seconds * 1000 + 80);
        }

        function scheduleLobbyWander(el) {
            clearEweWander(el);
            if (!canPastureWander(el) || !shouldRoam(el)) return;
            const play = isPlayPasture();
            const n = flockSize();
            const wait = play
                ? (9000 + Math.random() * 16000)
                : (4000 + Math.random() * 10000);
            const timer = window.setTimeout(() => {
                if (!canPastureWander(el) || !shouldRoam(el)) return;
                if (el.classList.contains('is-walking') || el.classList.contains('is-joining')) {
                    scheduleLobbyWander(el);
                    return;
                }
                const walkChance = play && n > 24 ? 0.12 : 0.32;
                const walkCap = play ? (n > 60 ? 4 : 8) : 18;
                if (Math.random() > walkChance || walkingCount() >= walkCap) {
                    if (!play && Math.random() < 0.28) {
                        el.dataset.mood = Math.random() < 0.45 ? 'eat' : 'idle';
                    }
                    scheduleLobbyWander(el);
                    return;
                }
                wanderLobbyEwe(el);
            }, wait);
            el.dataset.wanderTimer = String(timer);
        }

        let lobbySnackTimer = 0;
        let lobbySeparateTimer = 0;
        let lastSnackId = '';
        let biteMarkTimer = 0;
        let biteNibbleTimer = 0;
        let biteHealTimer = 0;
        const SNACK_WALK = { cycle: 1.12, minSeconds: 4.4, maxSeconds: 16 };
        const SNACK_SCALE = 1.28;

        function lobbyJoinSign() {
            return document.querySelector('.tv-lobby-join');
        }

        function qrNibbleSpot(el) {
            const chorus = document.getElementById('flockChorus');
            const card = lobbyJoinSign();
            if (!chorus || !card) return { gx: 2, gy: 78 };
            const field = chorus.getBoundingClientRect();
            const art = card.querySelector('.tv-sign-art-whole') || card.querySelector('.tv-sign-art') || card;
            const box = art.getBoundingClientRect();
            if (!field.width || !field.height) return { gx: 2, gy: 78 };
            const currentS = parseFloat((el && el.style.getPropertyValue('--s')) || '1') || 1;
            const drawnW = (el && el.getBoundingClientRect().width) || 110;
            const eweW = drawnW * (SNACK_SCALE / currentS);
            const cornerX = box.left + box.width * 0.93;
            const cornerY = box.top + box.height * 0.80;
            return {
                gx: ((cornerX + eweW * 0.50 - field.left) / field.width) * 100,
                gy: ((cornerY + eweW * 0.14 - field.top) / field.height) * 100
            };
        }

        function stopCardChew() {
            const card = lobbyJoinSign();
            if (card) card.classList.remove('is-nibbled');
        }

        function resetSignBite() {
            const card = lobbyJoinSign();
            if (!card) return;
            card.classList.remove('is-bitten', 'is-bite-1', 'is-bite-2', 'is-healing', 'is-healed', 'is-nibbled');
        }

        function clearSignBiteTimers() {
            window.clearTimeout(biteMarkTimer);
            window.clearTimeout(biteNibbleTimer);
            window.clearTimeout(biteHealTimer);
            biteMarkTimer = 0;
            biteNibbleTimer = 0;
            biteHealTimer = 0;
        }

        function markSignBitten(stage) {
            const card = lobbyJoinSign();
            if (!card || !biteMasksReady) return;
            card.classList.remove('is-healing');
            card.classList.add('is-bitten', stage === 1 ? 'is-bite-1' : 'is-bite-2');
        }

        function healSignBite() {
            const card = lobbyJoinSign();
            if (!card || !card.classList.contains('is-bitten')) return;
            const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            card.classList.add('is-healing');
            biteHealTimer = window.setTimeout(() => {
                card.classList.remove('is-bitten', 'is-bite-1', 'is-bite-2', 'is-healing', 'is-healed');
            }, reduce ? 0 : 6200);
        }

        function armLobbySnack() {
            window.clearTimeout(lobbySnackTimer);
            const lobby = document.querySelector('.tv-lobby');
            if (!lobby) return;
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            lobbySnackTimer = window.setTimeout(tryLobbySnack, 60000);
        }

        function tryLobbySnack() {
            const lobby = document.querySelector('.tv-lobby');
            if (!lobby) return;
            if (document.querySelector('#flockChorus .tv-ewe.is-snackish, #flockChorus .tv-ewe.is-nibbling')) {
                lobbySnackTimer = window.setTimeout(tryLobbySnack, 8000);
                return;
            }
            const pick = pickSnackEwe();
            if (!pick) {
                lobbySnackTimer = window.setTimeout(tryLobbySnack, 8000);
                return;
            }
            startQrNibble(pick);
            armLobbySnack();
        }

        function pickSnackEwe() {
            const ewes = [...document.querySelectorAll('#flockChorus .tv-ewe')].filter((el) =>
                !isLobbyEweBusy(el) && !el.classList.contains('is-walking')
            );
            if (!ewes.length) return null;
            const ranked = ewes
                .map((el) => ({ el, gy: parseFloat(el.style.getPropertyValue('--gy')) || 64 }))
                .sort((a, b) => a.gy - b.gy);
            const notLast = lastSnackId ? ranked.filter((row) => row.el.dataset.id !== lastSnackId) : ranked;
            const pool = notLast.length ? notLast : ranked;
            const farCount = Math.max(1, Math.ceil(pool.length / 2));
            const far = pool.slice(0, farCount);
            return far[Math.floor(Math.random() * far.length)].el;
        }

        function startQrNibble(el) {
            const lobby = document.querySelector('.tv-lobby');
            if (!lobby || !el || !el.isConnected) return;
            const chorus = document.getElementById('flockChorus');
            const card = document.querySelector('.tv-lobby-join');
            if (!chorus || !card || !chorus.getBoundingClientRect().width || !el.getBoundingClientRect().width) {
                window.setTimeout(() => startQrNibble(el), 250);
                return;
            }
            lastSnackId = el.dataset.id || '';
            clearEweWander(el);
            clearSignBiteTimers();
            resetSignBite();
            el.classList.add('is-snackish');
            const spot = qrNibbleSpot(el);
            el.classList.add('is-left');
            walkEweOnField(el, slotFromEwe(el, {
                gx: spot.gx,
                gy: spot.gy,
                scale: SNACK_SCALE,
                z: 80,
                mood: 'idle'
            }), () => {
                if (!el.isConnected || !document.querySelector('.tv-lobby')) return;
                el.classList.add('is-left', 'is-nibbling');
                el.dataset.mood = 'eat';
                const nibbleCard = lobbyJoinSign();
                if (nibbleCard) nibbleCard.classList.add('is-nibbled');
                biteMarkTimer = window.setTimeout(() => markSignBitten(1), 280);
                biteNibbleTimer = window.setTimeout(() => markSignBitten(2), 730);
                window.setTimeout(() => finishQrNibble(el), 5200 + Math.random() * 2800);
            }, SNACK_WALK);
        }

        function finishQrNibble(el) {
            stopCardChew();
            window.clearTimeout(biteHealTimer);
            biteHealTimer = window.setTimeout(healSignBite, 700);
            if (!el || !el.isConnected || !document.querySelector('.tv-lobby')) return;
            el.classList.remove('is-nibbling');
            const away = randomLobbyPoint(occupiedLobbyPoints(el), el);
            const depth = lobbyDepth(away.gy);
            const gx = parseFloat(el.style.getPropertyValue('--gx')) || 30;
            el.classList.toggle('is-left', away.gx < gx);
            walkEweOnField(el, slotFromEwe(el, {
                gx: away.gx,
                gy: away.gy,
                scale: depth.scale,
                z: depth.z,
                mood: Math.random() < 0.4 ? 'eat' : 'idle'
            }), () => {
                el.classList.remove('is-snackish');
                scheduleLobbyWander(el);
            }, SNACK_WALK);
        }

        function wanderLobbyEwe(el) {
            if (!canPastureWander(el)) return;
            const gx = parseFloat(el.style.getPropertyValue('--gx')) || 70;
            const gy = parseFloat(el.style.getPropertyValue('--gy')) || 64;
            const occupied = occupiedLobbyPoints(el);
            let dest = null;
            for (let i = 0; i < 16; i += 1) {
                const trySpot = clampLobbyPoint(gx + (Math.random() - 0.5) * 16, gy + (Math.random() - 0.5) * 12);
                if (spotIsClear(trySpot.gx, trySpot.gy, occupied, el)) {
                    dest = trySpot;
                    break;
                }
            }
            if (!dest) {
                scheduleLobbyWander(el);
                return;
            }
            const depth = lobbyDepth(dest.gy);
            el.classList.toggle('is-left', dest.gx < gx);
            walkEweOnField(el, slotFromEwe(el, {
                gx: dest.gx,
                gy: dest.gy,
                scale: depth.scale,
                z: depth.z
            }), () => scheduleLobbyWander(el));
        }

        function pickIdleMover(els, moved) {
            const idle = els.filter((el) => el && !isLobbyEweBusy(el) && !(moved && moved.has(el)));
            if (!idle.length) return null;
            return idle[Math.floor(Math.random() * idle.length)];
        }

        function separateLobbyEwe(el, opts) {
            if (!el || !el.isConnected || isLobbyEweBusy(el)) return;
            const me = readLobbyEwe(el);
            const occupied = occupiedLobbyPoints(el);
            let dest = null;
            if (opts && opts.line && opts.line.length === 2) {
                const a = opts.line[0];
                const b = opts.line[1];
                const dx = b.x - a.x;
                const dy = b.y - a.y;
                const len = Math.hypot(dx, dy) || 1;
                const side = Math.random() < 0.5 ? 1 : -1;
                const step = clampLobbyPoint(
                    me.gx + (-dy / len) * 11 * side,
                    me.gy + (dx / len) * 8 * side
                );
                if (!lobbySpotCrowded(step.gx, step.gy, occupied, el)) dest = step;
            } else {
                let nearest = null;
                let nearestDist = Infinity;
                occupied.forEach((other) => {
                    const dist = Math.hypot(other.gx - me.gx, (other.gy - me.gy) * 1.2);
                    if (dist < nearestDist) {
                        nearestDist = dist;
                        nearest = other;
                    }
                });
                if (nearest && nearestDist > 0.2) {
                    const step = clampLobbyPoint(
                        me.gx + ((me.gx - nearest.gx) / nearestDist) * 10,
                        me.gy + ((me.gy - nearest.gy) / nearestDist) * 8
                    );
                    if (!lobbySpotCrowded(step.gx, step.gy, occupied, el)) dest = step;
                }
            }
            if (!dest) {
                const field = pastureField();
                for (let i = 0; i < 28; i += 1) {
                    const fallback = clampLobbyPoint(
                        field.left + Math.random() * (field.right - field.left),
                        field.top + Math.random() * (field.bottom - field.top)
                    );
                    if (!lobbySpotCrowded(fallback.gx, fallback.gy, occupied, el)) {
                        dest = fallback;
                        break;
                    }
                }
            }
            if (!dest) {
                scheduleLobbyWander(el);
                return false;
            }
            clearEweWander(el);
            const depth = lobbyDepth(dest.gy);
            el.classList.toggle('is-left', dest.gx < me.gx);
            walkEweOnField(el, slotFromEwe(el, {
                gx: dest.gx,
                gy: dest.gy,
                scale: depth.scale,
                z: depth.z
            }), () => scheduleLobbyWander(el));
            return true;
        }

        function nudgeOverlappingLobbyEwes(maxMoves) {
            const chorus = document.getElementById('flockChorus');
            if (!chorus || !isPastureScene() || isQuietPasture()) return;
            const ewes = roamingEwes();
            if (ewes.length > 40) return;
            const limit = Math.max(1, Number(maxMoves) || 1);
            const boxes = ewes.map((el) => eweWorldBox(el));
            const moved = new Set();
            for (let i = 0; i < boxes.length; i += 1) {
                if (moved.size >= limit) return;
                for (let j = i + 1; j < boxes.length; j += 1) {
                    if (moved.size >= limit) return;
                    if (!boxesOverlap(boxes[i], boxes[j])) continue;
                    const mover = pickIdleMover([ewes[i], ewes[j]], moved);
                    if (!mover) continue;
                    if (separateLobbyEwe(mover)) moved.add(mover);
                }
            }
            if (moved.size || ewes.length > 18) return;
            const pts = ewes
                .filter((el) => !moved.has(el) && !el.classList.contains('is-walking'))
                .map((el) => eweLinePoint(el));
            for (let i = 0; i < pts.length; i += 1) {
                for (let j = i + 1; j < pts.length; j += 1) {
                    for (let k = j + 1; k < pts.length; k += 1) {
                        if (!pointsCollinear(pts[i], pts[j], pts[k])) continue;
                        const mover = pickIdleMover([pts[i].el, pts[j].el, pts[k].el], moved);
                        if (!mover) continue;
                        const line = [pts[i], pts[j], pts[k]].filter((p) => p.el !== mover).slice(0, 2);
                        if (separateLobbyEwe(mover, { line })) return;
                    }
                }
            }
        }

        function unstickJoinedEwe(el) {
            if (!el || !el.isConnected || isQuietPasture()) return;
            const others = roamingEwes(el);
            const mine = eweWorldBox(el);
            const hits = others.some((other) => boxesOverlap(mine, eweWorldBox(other)));
            if (hits) separateLobbyEwe(el);
        }

        function armLobbySeparate() {
            window.clearTimeout(lobbySeparateTimer);
            if (!document.querySelector('.tv-lobby')) return;
            lobbySeparateTimer = window.setTimeout(() => {
                nudgeOverlappingLobbyEwes(1);
                armLobbySeparate();
            }, 5200);
        }

        function playJoinJump(el) {
            if (!el) return;
            el.classList.add('is-joining');
            const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (!reduce) {
                el.classList.add('is-poofing');
                const poof = document.createElement('span');
                poof.className = 'tv-ewe-poof';
                poof.setAttribute('aria-hidden', 'true');
                poof.innerHTML = '<i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>';
                el.appendChild(poof);
                window.setTimeout(() => {
                    el.classList.remove('is-poofing');
                    if (poof.parentNode) poof.remove();
                }, 900);
            }
            const done = () => {
                if (!el.classList.contains('is-joining')) return;
                el.classList.remove('is-joining');
                scheduleLobbyWander(el);
            };
            const onEnd = (event) => {
                if (event.animationName && event.animationName !== 'eweJump') return;
                el.removeEventListener('animationend', onEnd);
                done();
            };
            el.addEventListener('animationend', onEnd);
            window.setTimeout(() => {
                el.removeEventListener('animationend', onEnd);
                done();
            }, 700);
        }

        function walkEweOnField(el, slot, onDone, opts) {
            const chorus = document.getElementById('flockChorus');
            const field = (chorus || el).getBoundingClientRect();
            const now = el.getBoundingClientRect();
            const destX = field.left + (slot.gx / 100) * field.width;
            const destY = field.top + (slot.gy / 100) * field.height;
            const dist = Math.hypot(destX - (now.left + now.width / 2), destY - (now.top + now.height * 0.72));
            if (dist < 10 && !(opts && opts.seconds)) {
                applyEweSlot(el, slot);
                if (onDone) onDone();
                return;
            }
            const cycle = (opts && opts.cycle) || 0.6;
            const stride = (now.width || 56) * 1.25;
            const minSeconds = (opts && opts.minSeconds) || 0.6 * 2;
            const maxSeconds = (opts && opts.maxSeconds) || 8;
            const seconds = (opts && opts.seconds) || Math.min(maxSeconds, Math.max(minSeconds, dist / (stride / cycle)));
            const gen = bumpEweWalk(el);
            const fromX = parseFloat(el.style.getPropertyValue('--gx')) || 0;
            const keepStride = !!(opts && opts.keepStride);
            el.classList.remove('is-joining');
            if (!keepStride) el.classList.remove('is-walking');
            el.classList.toggle('is-left', slot.gx < fromX);
            el.style.setProperty('--walk', `${seconds.toFixed(2)}s`);
            el.style.transitionDuration = `${seconds.toFixed(2)}s`;
            applyEweSlot(el, slot);
            el.classList.add('is-walking');
            onWalkFinished(el, gen, seconds, () => {
                if (!keepStride) el.classList.remove('is-walking');
                if (onDone) onDone();
            });
        }

        function syncLobbyFlock(chorus, slots) {
            const byId = new Map();
            chorus.querySelectorAll('.tv-ewe:not(.tv-dog)').forEach((el) => byId.set(el.dataset.id, el));
            const keep = new Set();
            const born = [];
            const roaming = !!document.querySelector('.tv-lobby, .tv-play');
            slots.forEach((slot) => {
                const id = String(slot.id);
                keep.add(id);
                const el = byId.get(id);
                if (!el) {
                    chorus.insertAdjacentHTML('beforeend', eweFigureHtml(slot));
                    const joiner = chorus.querySelector(`.tv-ewe[data-id="${CSS.escape(id)}"]`);
                    if (joiner) {
                        playJoinJump(joiner);
                        born.push(joiner);
                    }
                    return;
                }
                const cap = el.querySelector('figcaption');
                if (cap) cap.innerHTML = eweCaptionHtml(slot);
                if (!roaming) applyEweLook(el, slot);
            });
            byId.forEach((el, id) => {
                if (keep.has(id)) return;
                if (el.classList.contains('is-nibbling') || el.classList.contains('is-snackish')) {
                    stopCardChew();
                }
                clearEweWander(el);
                el.remove();
            });
            return born;
        }

        function renderFlock(players) {
            const chorus = document.getElementById('flockChorus');
            if (!chorus) return;
            const list = sortedFlockPlayers(players);
            const slots = placeFlock(list);
            const roaming = isPastureScene();
            const existing = chorus.querySelectorAll('.tv-ewe:not(.tv-dog)').length;
            chorus.dataset.flockKey = flockKey(list);
            chorus.dataset.dense = list.length > 28 ? '1' : '0';
            const nextBase = `${eweBaseSize(list.length)}px`;
            if (roaming) {
                if (existing) {
                    const born = syncLobbyFlock(chorus, slots);
                    chorus.style.setProperty('--ewe-base', nextBase);
                    if (!isQuietPasture() && born && born.length) {
                        window.setTimeout(() => born.forEach(unstickJoinedEwe), 900);
                    }
                    return;
                }
                chorus.style.setProperty('--ewe-base', nextBase);
                chorus.innerHTML = slots.map((slot) => eweFigureHtml(slot)).join('');
                const born = chorus.querySelectorAll('.tv-ewe:not(.tv-dog)');
                if (born.length === 1) playJoinJump(born[0]);
                else born.forEach((el) => {
                    if (shouldRoam(el)) scheduleLobbyWander(el);
                });
                return;
            }
            chorus.style.setProperty('--ewe-base', nextBase);
            chorus.dataset.ready = '0';
            chorus.innerHTML = slots.map((slot) => eweFigureHtml(slot)).join('');
        }

        function walkSecondsTo(el, leftVar, topVar) {
            const chorus = document.getElementById('flockChorus');
            const field = (chorus || el).getBoundingClientRect();
            const now = el.getBoundingClientRect();
            const leftPct = parseFloat(el.style.getPropertyValue(`--${leftVar}`)) || 0;
            const topPct = parseFloat(el.style.getPropertyValue(`--${topVar}`)) || 0;
            const destX = field.left + (leftPct / 100) * field.width;
            const destY = field.top + (topPct / 100) * field.height;
            const dist = Math.hypot(destX - (now.left + now.width / 2), destY - (now.top + now.height * 0.72));
            const body = now.width || 56;
            const cycle = 0.6;
            const stride = body * 1.25;
            const seconds = dist / (stride / cycle);
            return Math.min(8, Math.max(cycle * 2, seconds));
        }

        function applyPenDepth(el, gy, inside) {
            const destDepth = lobbyDepth(gy);
            el.style.setProperty('--s', String(destDepth.scale));
            el.style.setProperty('--z', String(Math.min(64, destDepth.z + (inside ? 6 : 12))));
        }

        function penSpriteToStage(sx, sy) {
            const pasture = document.querySelector('.tv-pasture');
            const img = document.querySelector('.tv-play .tv-pen-art');
            if (!pasture || !img) return { x: GATE_MOUTH.x, y: GATE_MOUTH.y };
            const stage = pasture.getBoundingClientRect();
            const box = img.getBoundingClientRect();
            if (!stage.width || !stage.height || !box.width || !box.height) {
                return { x: GATE_MOUTH.x, y: GATE_MOUTH.y };
            }
            const scale = Math.min(box.width / PEN_SPRITE.w, box.height / PEN_SPRITE.h);
            const left = box.right - PEN_SPRITE.w * scale;
            const top = box.bottom - PEN_SPRITE.h * scale;
            return {
                x: ((left + sx * scale) / stage.width) * 100,
                y: ((top + sy * scale) / stage.height) * 100
            };
        }

        function playGatePoints() {
            return {
                mouth: penSpriteToStage(GATE_MOUTH_SPRITE.x, GATE_MOUTH_SPRITE.y),
                approach: penSpriteToStage(GATE_APPROACH_SPRITE.x, GATE_APPROACH_SPRITE.y),
                drop: penSpriteToStage(GATE_DROP_SPRITE.x, GATE_DROP_SPRITE.y),
                clear: penSpriteToStage(GATE_CLEAR_SPRITE.x, GATE_CLEAR_SPRITE.y)
            };
        }

        function jitterGatePoint(point, el, spreadX, spreadY) {
            const hash = nameHash((el && (el.dataset.name || el.dataset.id)) || '');
            return {
                x: point.x + ((hash % 5) - 2) * spreadX,
                y: point.y + (((hash >> 3) % 5) - 2) * spreadY
            };
        }

        function gatePathOf(el) {
            const pts = playGatePoints();
            return {
                mouth: jitterGatePoint(pts.mouth, el, 0.16, 0.1),
                drop: jitterGatePoint(pts.drop, el, 0.2, 0.12),
                clear: jitterGatePoint(pts.clear, el, 0.22, 0.14)
            };
        }

        function compactGatePath(points) {
            const out = [];
            (points || []).forEach((point) => {
                if (!point || !Number.isFinite(point.x) || !Number.isFinite(point.y)) return;
                const last = out[out.length - 1];
                if (last && Math.hypot(point.x - last.x, point.y - last.y) < 0.32) return;
                out.push({ x: point.x, y: point.y, cut: point.cut });
            });
            return out;
        }

        function sampleSmoothPath(points) {
            const pts = compactGatePath(points);
            if (pts.length <= 2) return pts.map((point) => ({ x: point.x, y: point.y }));
            const out = [{ x: pts[0].x, y: pts[0].y }];
            for (let i = 1; i < pts.length - 1; i += 1) {
                const prev = pts[i - 1];
                const corner = pts[i];
                const next = pts[i + 1];
                const cut = Math.min(0.46, Math.max(0.14, corner.cut == null ? 0.3 : corner.cut));
                const p0 = {
                    x: corner.x + (prev.x - corner.x) * cut,
                    y: corner.y + (prev.y - corner.y) * cut
                };
                const p2 = {
                    x: corner.x + (next.x - corner.x) * cut,
                    y: corner.y + (next.y - corner.y) * cut
                };
                out.push(p0);
                for (let step = 1; step <= 7; step += 1) {
                    const t = step / 7;
                    const u = 1 - t;
                    out.push({
                        x: u * u * p0.x + 2 * u * t * corner.x + t * t * p2.x,
                        y: u * u * p0.y + 2 * u * t * corner.y + t * t * p2.y
                    });
                }
            }
            const end = pts[pts.length - 1];
            out.push({ x: end.x, y: end.y });
            return out;
        }

        function walkEase(t) {
            const u = Math.min(1, Math.max(0, t));
            return u * 0.72 + (u * u * (3 - 2 * u)) * 0.28;
        }

        function walkSmoothPath(el, points, onDone, opts) {
            const samples = sampleSmoothPath(points);
            if (samples.length < 2) {
                if (onDone) onDone();
                return;
            }
            const chorus = document.getElementById('flockChorus');
            const field = (chorus || el).getBoundingClientRect();
            const lengths = [0];
            let distPx = 0;
            for (let i = 1; i < samples.length; i += 1) {
                const dx = (samples[i].x - samples[i - 1].x) * field.width / 100;
                const dy = (samples[i].y - samples[i - 1].y) * field.height / 100;
                distPx += Math.hypot(dx, dy);
                lengths.push(distPx);
            }
            const total = lengths[lengths.length - 1] || 1;
            const body = el.getBoundingClientRect().width || 56;
            const pace = (opts && opts.pace) || ((body * 1.25) / 0.6);
            const minS = (opts && opts.minSeconds) || 1.7;
            const maxS = (opts && opts.maxSeconds) || 7.2;
            const seconds = Math.min(maxS, Math.max(minS, distPx / Math.max(8, pace)));
            const gen = bumpEweWalk(el);
            const insideX = opts && Number(opts.insideX);
            let markedIn = false;
            let lastX = parseFloat(el.style.getPropertyValue('--gx')) || samples[0].x;
            el.classList.add('is-walking', 'is-placed');
            el.style.transitionDuration = '0s';
            const started = performance.now();
            const at = (distance) => {
                let i = 1;
                while (i < lengths.length && lengths[i] < distance) i += 1;
                const i1 = Math.min(i, samples.length - 1);
                const i0 = Math.max(0, i1 - 1);
                const span = (lengths[i1] - lengths[i0]) || 1;
                const t = (distance - lengths[i0]) / span;
                return {
                    x: samples[i0].x + (samples[i1].x - samples[i0].x) * t,
                    y: samples[i0].y + (samples[i1].y - samples[i0].y) * t
                };
            };
            const tick = (now) => {
                if (el.dataset.walkGen !== gen || !el.isConnected) return;
                if (opts && opts.live && !opts.live(el)) return;
                const u = Math.min(1, (now - started) / (seconds * 1000));
                const raw = at(walkEase(u) * total);
                const point = (opts && typeof opts.avoid === 'function') ? opts.avoid(raw) : raw;
                el.style.setProperty('--gx', String(point.x));
                el.style.setProperty('--gy', String(point.y));
                el.style.setProperty('--s', String(pastureScale(point.y)));
                if (Math.abs(point.x - lastX) > 0.05) {
                    el.classList.toggle('is-left', point.x < lastX);
                    lastX = point.x;
                }
                if (!markedIn && Number.isFinite(insideX) && point.x >= insideX - 0.4) {
                    markedIn = true;
                    el.classList.add('is-in');
                    el.classList.remove('is-outside');
                    applyPenDepth(el, point.y, true);
                }
                if (u < 1) {
                    window.requestAnimationFrame(tick);
                    return;
                }
                el.classList.remove('is-placed');
                el.style.transitionDuration = '';
                if (onDone) onDone();
            };
            window.requestAnimationFrame(tick);
        }

        function playGateLive(el) {
            return el.isConnected && !!document.querySelector('.tv-play') && el.classList.contains('is-gating');
        }

        function beginGateTrip(el, inbound) {
            clearEweWander(el);
            el.classList.add('is-gating');
            el.classList.toggle('is-entering', !!inbound);
        }

        function endGateTrip(el) {
            el.classList.remove('is-gating', 'is-entering', 'is-walking');
        }

        function currentEwePoint(el) {
            return {
                x: parseFloat(el.style.getPropertyValue('--gx')) || 50,
                y: parseFloat(el.style.getPropertyValue('--gy')) || 70
            };
        }

        function enterPenAlongGate(el, fromApproach) {
            beginGateTrip(el, true);
            el.classList.remove('is-in', 'is-outside');
            const slot = slotFromEwe(el);
            const path = gatePathOf(el);
            const start = fromApproach
                ? { x: slot.ox, y: slot.oy }
                : currentEwePoint(el);
            if (fromApproach) {
                el.style.setProperty('--gx', String(start.x));
                el.style.setProperty('--gy', String(start.y));
            }
            const points = [start];
            if (!fromApproach) points.push({ x: slot.ox, y: slot.oy, cut: 0.24 });
            points.push(Object.assign({}, path.mouth, { cut: 0.2 }));
            if (isAnsweringOpen()) {
                points.push(Object.assign({}, path.drop, { cut: 0.36 }));
                points.push(Object.assign({}, path.clear, { cut: 0.44 }));
            }
            points.push({ x: slot.px, y: slot.py });
            walkSmoothPath(el, points, () => {
                if (!playGateLive(el)) return;
                el.classList.add('is-in');
                el.classList.remove('is-outside');
                applyPenDepth(el, slot.py, true);
                el.style.setProperty('--gx', String(slot.px));
                el.style.setProperty('--gy', String(slot.py));
                endGateTrip(el);
            }, {
                live: playGateLive,
                insideX: path.mouth.x
            });
        }

        function enterPenViaGate(el) {
            enterPenAlongGate(el, false);
        }

        function enterPenFromApproach(el) {
            enterPenAlongGate(el, true);
        }

        function exitPenViaGate(el) {
            beginGateTrip(el, false);
            const path = gatePathOf(el);
            const slot = slotFromEwe(el);
            el.style.setProperty('--gx', el.style.getPropertyValue('--px'));
            el.style.setProperty('--gy', el.style.getPropertyValue('--py'));
            el.classList.remove('is-in', 'is-outside');
            const points = [currentEwePoint(el)];
            if (isAnsweringOpen()) {
                points.push(Object.assign({}, path.clear, { cut: 0.4 }));
                points.push(Object.assign({}, path.drop, { cut: 0.34 }));
            }
            points.push(Object.assign({}, path.mouth, { cut: 0.22 }));
            points.push({ x: slot.ox, y: slot.oy });
            walkSmoothPath(el, points, () => {
                if (!playGateLive(el)) return;
                el.classList.add('is-outside');
                applyPenDepth(el, slot.oy, false);
                el.style.setProperty('--gx', String(slot.ox));
                el.style.setProperty('--gy', String(slot.oy));
                endGateTrip(el);
            }, { live: playGateLive });
        }

        function moveEwe(el, next, skipWalk) {
            clearEweWander(el);
            if (!skipWalk && isPlayPasture() && walkingCount() >= 8) skipWalk = true;
            const destLeft = next.outside ? 'ox' : 'px';
            const destTop = next.outside ? 'oy' : 'py';
            const destGy = parseFloat(el.style.getPropertyValue(`--${destTop}`)) || 70;
            if (skipWalk) {
                el.classList.remove('is-walking', 'is-entering', 'is-gating');
                el.classList.toggle('is-outside', !!next.outside);
                el.classList.toggle('is-in', !!next.inside);
                el.style.setProperty('--gx', el.style.getPropertyValue(`--${destLeft}`));
                el.style.setProperty('--gy', el.style.getPropertyValue(`--${destTop}`));
                applyPenDepth(el, destGy, !!next.inside);
                el.classList.add('is-placed');
                requestAnimationFrame(() => el.classList.remove('is-placed'));
                return;
            }
            if (next.inside && !el.classList.contains('is-in')) {
                if (el.classList.contains('is-outside')) enterPenFromApproach(el);
                else enterPenViaGate(el);
                return;
            }
            if (next.outside && el.classList.contains('is-in')) {
                exitPenViaGate(el);
                return;
            }
            const gen = bumpEweWalk(el);
            const seconds = walkSecondsTo(el, destLeft, destTop);
            el.classList.remove('is-walking', 'is-entering', 'is-gating');
            el.style.setProperty('--walk', `${seconds.toFixed(2)}s`);
            el.style.transitionDuration = `${seconds.toFixed(2)}s`;
            const fromX = parseFloat(el.style.getPropertyValue('--gx')) || 0;
            const toX = parseFloat(el.style.getPropertyValue(`--${destLeft}`)) || 0;
            el.classList.toggle('is-left', toX < fromX);
            el.classList.toggle('is-outside', !!next.outside);
            el.classList.toggle('is-in', !!next.inside);
            applyPenDepth(el, destGy, !!next.inside);
            el.classList.add('is-walking');
            onWalkFinished(el, gen, seconds, () => endGateTrip(el));
        }

        function paintFlock(answeredPlayers, instant, sentBackPlayers) {
            const chorus = document.getElementById('flockChorus');
            const answered = answeredLookup(answeredPlayers);
            const sentBack = answeredLookup(sentBackPlayers);
            const skipWalk = instant || (chorus && chorus.dataset.ready !== '1');
            document.querySelectorAll('#flockChorus .tv-ewe:not(.tv-dog)').forEach((el) => {
                const wantsOut = playerHasAnswered(el, sentBack);
                const wantsIn = !wantsOut && playerHasAnswered(el, answered);
                const isOut = el.classList.contains('is-outside');
                const isIn = el.classList.contains('is-in');
                if (wantsOut === isOut && wantsIn === isIn) return;
                if (el.classList.contains('is-gating') || el.classList.contains('is-entering')) return;
                if (wantsOut) {
                    moveEwe(el, { outside: true, inside: false }, skipWalk);
                } else if (wantsIn) {
                    moveEwe(el, { outside: false, inside: true }, skipWalk);
                } else {
                    el.classList.remove('is-in', 'is-outside', 'is-walking', 'is-entering', 'is-gating');
                    const grazeGy = parseFloat(el.style.getPropertyValue('--gy')) || 70;
                    const grazeDepth = lobbyDepth(grazeGy);
                    el.style.setProperty('--s', String(grazeDepth.scale));
                    el.style.setProperty('--z', String(grazeDepth.z));
                }
            });
            if (chorus) chorus.dataset.ready = '1';
            const inCount = document.querySelectorAll('#flockChorus .tv-ewe.is-in:not(.tv-dog)').length;
            const total = playerEwes().length;
            const inEl = document.getElementById('flockInCount');
            const outEl = document.getElementById('flockOutCount');
            if (inEl) inEl.textContent = String(inCount);
            if (outEl) outEl.textContent = String(Math.max(0, total - inCount));
            return { inCount, total };
        }

        function showPlayingScreen() {
            const restoreBandit = gameState && gameState.gameState === 'grading' && wranglerWasOut;
            resetWrangler(true);
            if (restoreBandit) wranglerWasOut = true;
            const currentQuestion = gameState.questions[gameState.currentQuestion];

        function fitQuestionPrompt(el, maxLines, minPx) {
            if (!el) return false;
            el.style.removeProperty('font-size');
            const computed = getComputedStyle(el);
            const start = parseFloat(computed.fontSize);
            if (!start) return false;
            const rawLh = computed.lineHeight;
            const linePx = rawLh.endsWith('px') ? parseFloat(rawLh) : start * (parseFloat(rawLh) || 1.02);
            const lineRatio = linePx / start;
            const min = Math.max(36, minPx || (window.innerHeight || 1080) * 0.048);
            const fits = (size) => {
                el.style.setProperty('font-size', `${size}px`, 'important');
                const lh = size * lineRatio;
                return el.scrollHeight <= lh * maxLines + 3;
            };
            if (fits(start)) {
                el.style.removeProperty('font-size');
                return true;
            }
            let lo = min;
            let hi = start;
            let best = min;
            for (let i = 0; i < 14; i += 1) {
                const mid = (lo + hi) / 2;
                if (fits(mid)) {
                    best = mid;
                    lo = mid;
                } else {
                    hi = mid;
                }
            }
            el.style.setProperty('font-size', `${best}px`, 'important');
            const lh = best * lineRatio;
            return el.scrollHeight <= lh * maxLines + 3;
        }

        function fitPlayPrompt() {
            const el = document.querySelector('.tv-play .question-prompt');
            if (!el) return;
            const min = Math.max(48, (window.innerHeight || 1080) * 0.062);
            if (fitQuestionPrompt(el, 4, min)) return;
            fitQuestionPrompt(el, 5, min);
        }

        function fitBannerAnswer(el) {
            if (!el || !el.isConnected) return;
            const face = el.closest('.tv-flag-face');
            if (!face) return;
            const pts = face.querySelector('.tv-post-pts');
            el.style.removeProperty('font-size');
            const start = parseFloat(getComputedStyle(el).fontSize);
            if (!start) return;
            const isPennant = !!el.closest('.tv-banner.is-pennant');
            const min = Math.max(isPennant ? 14 : 22, (window.innerHeight || 1080) * (isPennant ? 0.018 : 0.026));
            const maxLines = isPennant ? 5 : 3;
            const lineRatio = 1.15;
            const room = () => {
                const box = face.getBoundingClientRect();
                const ptsH = pts ? pts.getBoundingClientRect().height : 0;
                return Math.max(18, box.height - ptsH - 6);
            };
            const fits = (size) => {
                el.style.setProperty('font-size', `${size}px`, 'important');
                const lh = size * lineRatio;
                if (el.scrollHeight > room() + 2) return false;
                if (el.scrollHeight > lh * maxLines + 4) return false;
                if (el.clientWidth && el.scrollWidth > el.clientWidth + 2) return false;
                return true;
            };
            if (fits(start)) {
                el.style.removeProperty('font-size');
                return;
            }
            let lo = min;
            let hi = start;
            let best = min;
            for (let i = 0; i < 12; i += 1) {
                const mid = (lo + hi) / 2;
                if (fits(mid)) {
                    best = mid;
                    lo = mid;
                } else {
                    hi = mid;
                }
            }
            el.style.setProperty('font-size', `${best}px`, 'important');
        }
        
        const BANDIT_AT_DEFAULT = 30;
        const BANDIT_HERD_RADIUS = 12;
        let wranglerGen = 0;
        let wranglerQuestion = '';
        let wranglerWasOut = false;
        let banditYipEnd = 0;
        let banditYipLoop = 0;
        let banditHerdTimer = 0;
        let banditFocus = null;

        function banditAt() {
            const n = Number(gameState && gameState.settings && gameState.settings.banditAt);
            if (!Number.isFinite(n) || n < 0) return BANDIT_AT_DEFAULT;
            return n;
        }

        function pastureHoldsBandit() {
            const phase = gameState && gameState.gameState;
            return !!document.querySelector('.tv-play') && (phase === 'playing' || phase === 'grading');
        }

        function wranglerKey() {
            return `${(gameState && gameState.gameCode) || ''}|${gameState && gameState.currentQuestion}`;
        }

        function remainingFieldSheep() {
            return Array.from(playerEwes()).filter((el) =>
                !el.classList.contains('is-in') &&
                !el.classList.contains('is-gating') &&
                !el.classList.contains('is-entering')
            );
        }

        function idleHerdSheep() {
            return remainingFieldSheep().filter((el) => !el.classList.contains('is-walking'));
        }

        function wranglerHtml(spot) {
            const gx = spot && Number.isFinite(spot.gx) ? spot.gx : PLAY_FIELD.left + 6;
            const gy = spot && Number.isFinite(spot.gy) ? spot.gy : PLAY_FIELD.bottom - 1.2;
            return `<figure class="tv-ewe tv-dog" data-id="__wrangler__" data-coat="dog" data-mood="idle" style="--gx:${gx};--gy:${gy};--px:${gx};--py:${gy};--ox:${gx};--oy:${gy};--s:1;--z:52;--idle:0s"><span class="tv-ewe-art" aria-hidden="true"><span class="tv-ewe-strip"></span></span></figure>`;
        }

        function ensureWrangler(spot) {
            const chorus = document.getElementById('flockChorus');
            if (!chorus || !document.querySelector('.tv-play')) return null;
            let dog = chorus.querySelector('.tv-dog');
            if (!dog) {
                chorus.insertAdjacentHTML('beforeend', wranglerHtml(spot));
                dog = chorus.querySelector('.tv-dog');

            if (dog) {
                dog.querySelectorAll('.tv-dog-yips').forEach((el) => el.remove());

        function resetWrangler(instant) {
            wranglerGen += 1;
            wranglerQuestion = '';
            wranglerWasOut = false;
            banditFocus = null;
            const dog = document.querySelector('#flockChorus .tv-dog');
            stopBanditYips(dog);
            window.clearTimeout(banditHerdTimer);
            if (!dog) return;
            if (instant || !document.querySelector('.tv-play')) {
                dog.remove();
                return;
            }
            const gy = parseFloat(dog.style.getPropertyValue('--gy')) || 80;
            const depth = lobbyDepth(gy);
            walkEweOnField(dog, slotFromEwe(dog, {
                gx: -14,
                gy,
                scale: depth.scale,
                z: depth.z
            }), () => {
                if (dog.isConnected) dog.remove();
            }, { cycle: 0.4, minSeconds: 0.55, maxSeconds: 1.6 });
        }

        function occupiedFieldSheep(exceptEl) {
            return Array.from(playerEwes()).filter((el) =>
                el !== exceptEl &&
                !el.classList.contains('is-in') &&
                !el.classList.contains('is-outside')
            ).map(readLobbyEwe);
        }

        function clampBanditPoint(x, y) {
            return {
                gx: Math.min(PLAY_FIELD.right - 1.2, Math.max(-14, x)),
                gy: Math.min(PLAY_FIELD.bottom - 0.5, Math.max(PLAY_FIELD.top + 1.2, y))
            };
        }

        function banditSheepGap(gx, gy, other) {
            return Math.hypot((other.gx || 0) - gx, ((other.gy || 0) - gy) * 1.45);
        }

        function banditBlocked(gx, gy, dog, minSep) {
            const need = minSep == null ? 8.2 : minSep;
            return occupiedFieldSheep(dog).some((other) => banditSheepGap(gx, gy, other) < need);
        }

        function banditClearPoint(dog, gx, gy, minSep) {
            const need = minSep == null ? 8.2 : minSep;
            const tries = [clampBanditPoint(gx, gy)];
            for (let r = 2.2; r <= 20; r += 2) {
                for (let a = 0; a < 14; a += 1) {
                    const rad = (a * Math.PI / 7) + Math.PI / 2;
                    tries.push(clampBanditPoint(gx + Math.cos(rad) * r, gy + Math.sin(rad) * r * 0.7));
                }
            }
            for (let i = 0; i < tries.length; i += 1) {
                const p = tries[i];
                if (!banditBlocked(p.gx, p.gy, dog, need)) return p;
            }
            return clampBanditPoint(gx, PLAY_FIELD.bottom - 0.8);
        }

        function banditLineHits(dog, a, b, minSep) {
            const steps = 16;
            for (let s = 1; s < steps; s += 1) {
                const t = s / steps;
                if (banditBlocked(a.gx + (b.gx - a.gx) * t, a.gy + (b.gy - a.gy) * t, dog, minSep)) return true;
            }
            return false;
        }

        function banditRoute(dog, dest) {
            const start = currentEwePoint(dog);
            const from = { gx: start.x, gy: start.y };
            const to = banditClearPoint(dog, dest.gx, dest.gy);
            const points = [{ x: from.gx, y: from.gy }];
            if (banditLineHits(dog, from, to)) {
                const hemY = Math.min(PLAY_FIELD.bottom - 0.9, Math.max(from.gy, to.gy) + 6);
                points.push({ x: from.gx, y: hemY, cut: 0.12 });
                points.push({ x: to.gx, y: hemY, cut: 0.12 });
            }
            points.push({ x: to.gx, y: to.gy });
            return points;
        }

        function banditOutrunRoute(dog, dest) {
            const start = currentEwePoint(dog);
            const from = { gx: start.x, gy: start.y };
            const to = banditClearPoint(dog, dest.gx, dest.gy);
            const points = [{ x: from.gx, y: from.gy }];
            if (Math.hypot(to.gx - from.gx, to.gy - from.gy) < 11) {
                points.push({ x: to.gx, y: to.gy });
                return points;
            }
            const lowRoom = PLAY_FIELD.bottom - Math.max(from.gy, to.gy);
            const highRoom = Math.min(from.gy, to.gy) - PLAY_FIELD.top;
            const goLow = lowRoom >= highRoom;
            const wingY = goLow
                ? Math.min(PLAY_FIELD.bottom - 0.8, Math.max(from.gy, to.gy) + 9)
                : Math.max(PLAY_FIELD.top + 3.2, Math.min(from.gy, to.gy) - 8);
            const wingX = from.gx + (to.gx - from.gx) * 0.58;
            points.push({ x: from.gx + (wingX - from.gx) * 0.28, y: from.gy + (wingY - from.gy) * 0.72, cut: 0.2 });
            points.push({ x: wingX, y: wingY, cut: 0.16 });
            points.push({ x: to.gx, y: wingY, cut: 0.16 });
            points.push({ x: to.gx, y: to.gy });
            return points;
        }

        function setBanditGait(dog, gait) {
            if (!dog) return;
            dog.classList.toggle('is-sitting', gait === 'sit');
            dog.classList.toggle('is-walking', gait === 'walk' || gait === 'run');
            dog.classList.toggle('is-running', gait === 'run');
            dog.classList.toggle('is-jumping', gait === 'jump');
            if (gait !== 'yip') dog.classList.remove('is-yipping');
            if (gait === 'sit') dog.classList.remove('is-left');
        }

        function banditAvoidPoint(dog, point) {
            const need = 8.2;
            if (!banditBlocked(point.x, point.y, dog, need)) return point;
            const tries = [];
            for (let r = 2; r <= 18; r += 2) {
                for (let a = 0; a < 14; a += 1) {
                    const rad = (a * Math.PI / 7) + Math.PI / 2;
                    tries.push(clampBanditPoint(point.x + Math.cos(rad) * r, point.y + Math.sin(rad) * r * 0.72));
                }
            }
            for (let i = 0; i < tries.length; i += 1) {
                const p = tries[i];
                if (!banditBlocked(p.gx, p.gy, dog, need)) return { x: p.gx, y: p.gy };
            }
            const hem = clampBanditPoint(point.x, PLAY_FIELD.bottom - 0.6);
            return { x: hem.gx, y: hem.gy };
        }

        function parkBandit(dog, point) {
            const parked = banditAvoidPoint(dog, point);
            const depth = lobbyDepth(parked.y);
            dog.style.setProperty('--gx', String(parked.x));
            dog.style.setProperty('--gy', String(parked.y));
            dog.style.setProperty('--s', String(depth.scale * 1.06));
            dog.style.setProperty('--z', String(Math.max(depth.z, 54)));
            return parked;
        }

        function walkBanditTo(dog, gx, gy, onDone, opts) {
            if (!dog || !dog.isConnected) {
                if (onDone) onDone();
                return;
            }
            const dest = banditClearPoint(dog, gx, gy);
            const here = currentEwePoint(dog);
            const gait = (opts && opts.gait) || 'run';
            if (Math.hypot(dest.gx - here.x, dest.gy - here.y) < 2.2) {
                parkBandit(dog, { x: dest.gx, y: dest.gy });
                if (onDone) onDone();
                return;
            }
            setBanditGait(dog, gait);
            const body = dog.getBoundingClientRect().width || 96;
            const running = gait === 'run';
            const points = (opts && opts.outrun) ? banditOutrunRoute(dog, dest) : banditRoute(dog, dest);
            walkSmoothPath(dog, points, () => {
                dog.classList.remove('is-walking', 'is-running', 'is-jumping');
                parkBandit(dog, currentEwePoint(dog));
                if (onDone) onDone();
            }, {
                live: () => dog.isConnected && pastureHoldsBandit(),
                avoid: (point) => banditAvoidPoint(dog, point),
                minSeconds: running ? 0.4 : 0.7,
                maxSeconds: running ? 2.7 : 4.2,
                pace: body * (running ? 2.7 : 1.08)
            });
        }

        function banditJumpToward(dog, dest, onDone) {
            if (!dog || !dog.isConnected) {
                if (onDone) onDone();
                return;
            }
            const here = currentEwePoint(dog);
            const hop = banditClearPoint(
                dog,
                here.x + (dest.gx - here.x) * 0.3,
                here.y + (dest.gy - here.y) * 0.3
            );
            setBanditGait(dog, 'jump');
            dog.classList.toggle('is-left', hop.gx < here.x);
            walkSmoothPath(dog, [
                { x: here.x, y: here.y },
                { x: hop.gx, y: hop.gy }
            ], () => {
                dog.classList.remove('is-jumping', 'is-walking', 'is-running');
                parkBandit(dog, currentEwePoint(dog));
                if (onDone) onDone();
            }, {
                live: () => dog.isConnected && pastureHoldsBandit(),
                avoid: (point) => banditAvoidPoint(dog, point),
                minSeconds: 0.5,
                maxSeconds: 0.54,
                pace: 2400
            });
        }

        function gateWatchSpot() {
            const gate = playGatePoints();
            const dog = document.querySelector('#flockChorus .tv-dog');
            const raw = clampLobbyPoint(gate.approach.x - 10, gate.approach.y + 4);
            return dog ? banditClearPoint(dog, raw.gx, raw.gy) : raw;
        }

        function huddleAnchor() {
            const gate = playGatePoints().approach;
            return {
                x: Math.min(PLAY_FIELD.right - 3.2, gate.x - 4.5),
                y: gate.y
            };
        }

        function stragglerHuddlePoint(el, pack) {
            const list = pack || remainingFieldSheep();
            const i = Math.max(0, list.indexOf(el));
            const n = Math.max(1, list.length);
            const cols = n <= 2 ? n : (n <= 6 ? 2 : 3);
            const col = i % cols;
            const row = Math.floor(i / cols);
            const hash = nameHash((el && (el.dataset.id || el.dataset.name)) || String(i));
            const anchor = huddleAnchor();
            return clampLobbyPoint(
                anchor.x - row * 4.1 - (hash % 3) * 0.3,
                anchor.y + (col - (cols - 1) / 2) * 4.4 + (((hash >> 2) % 3) - 1) * 0.45
            );
        }

        function isInHuddle(el) {
            const dest = stragglerHuddlePoint(el);
            const p = currentEwePoint(el);
            return Math.hypot(dest.gx - p.x, dest.gy - p.y) < 4.2;
        }

        function dogBehindSheep(el) {
            const dog = document.querySelector('#flockChorus .tv-dog');
            const p = currentEwePoint(el);
            const dest = stragglerHuddlePoint(el);
            const dx = dest.gx - p.x;
            const dy = dest.gy - p.y;
            const len = Math.hypot(dx, dy) || 1;
            const raw = {
                gx: p.x - (dx / len) * 8.5,
                gy: p.y - (dy / len) * 3.2
            };
            return dog ? banditClearPoint(dog, raw.gx, raw.gy) : raw;
        }

        function huddleDistance(el) {
            const dest = stragglerHuddlePoint(el);
            const p = currentEwePoint(el);
            return Math.hypot(dest.gx - p.x, dest.gy - p.y);
        }

        function pickHerdTarget(sheep, dog) {
            if (!sheep || !sheep.length) return null;
            if (dog) {
                const origin = currentEwePoint(dog);
                return sheep.slice().sort((a, b) => {
                    const pa = currentEwePoint(a);
                    const pb = currentEwePoint(b);
                    return Math.hypot(pa.x - origin.x, (pa.y - origin.y) * 1.35)
                        - Math.hypot(pb.x - origin.x, (pb.y - origin.y) * 1.35);
                })[0];
            }
            return sheep.slice().sort((a, b) => huddleDistance(b) - huddleDistance(a))[0];
        }

        function banditSpawnPoint() {
            const gate = playGatePoints().approach;
            return clampBanditPoint(
                Math.min(PLAY_FIELD.right - 2.2, gate.x - 7),
                PLAY_FIELD.bottom - 1.2
            );
        }

        function isBanditBehind(dog, el) {
            const here = currentEwePoint(dog);
            const behind = dogBehindSheep(el);
            return Math.hypot(behind.gx - here.x, behind.gy - here.y) < 6.5;
        }

        function eweGap(a, b) {
            const pa = currentEwePoint(a);
            const pb = currentEwePoint(b);
            return Math.hypot(pb.x - pa.x, (pb.y - pa.y) * 1.35);
        }

        function sheepNearBandit(dog, el) {
            return eweGap(dog, el) <= BANDIT_HERD_RADIUS;
        }

        function herdSheepTowardGate(el, pack) {
            if (!el || !el.isConnected) return;
            if (el.classList.contains('is-in') || el.classList.contains('is-gating') || el.classList.contains('is-entering')) return;
            if (el.classList.contains('is-walking')) return;
            const dest = stragglerHuddlePoint(el, pack);
            const p = currentEwePoint(el);
            if (Math.hypot(dest.gx - p.x, dest.gy - p.y) < 3) return;
            const depth = lobbyDepth(dest.gy);
            walkEweOnField(el, slotFromEwe(el, {
                gx: dest.gx,
                gy: dest.gy,
                scale: depth.scale,
                z: depth.z
            }), null, { cycle: 0.42, minSeconds: 0.7, maxSeconds: 2.8 });
        }

        function corralNearBandit(dog) {
            if (!dog || !dog.isConnected) return;
            if (dog.classList.contains('is-jumping') || dog.classList.contains('is-walking')) return;
            const focus = (banditFocus && banditFocus.isConnected) ? banditFocus : null;
            if (focus && eweGap(dog, focus) > BANDIT_HERD_RADIUS + 5) return;
            const pack = remainingFieldSheep();
            idleHerdSheep().forEach((el) => {
                const inFocus = !focus || el === focus || eweGap(el, focus) <= BANDIT_HERD_RADIUS;
                if (inFocus && sheepNearBandit(dog, el)) herdSheepTowardGate(el, pack);
            });
        }

        function keepCorrallingNearBandit(dog, gen) {
            window.clearTimeout(banditHerdTimer);
            const loop = () => {
                if (gen !== wranglerGen || !dog || !dog.isConnected || !pastureHoldsBandit()) return;
                corralNearBandit(dog);
                banditHerdTimer = window.setTimeout(loop, 160);
            };
            banditHerdTimer = window.setTimeout(loop, 50);
        }

        function stopBanditYips(dog) {
            window.clearTimeout(banditYipEnd);
            window.clearTimeout(banditYipLoop);
            if (dog) dog.classList.remove('is-yipping', 'is-jumping', 'is-running');
        }

        function banditYip(dog, gen) {
            if (!dog || !dog.isConnected || gen !== wranglerGen) return;
            if (dog.classList.contains('is-walking') || dog.classList.contains('is-jumping')) return;
            dog.classList.remove('is-yipping');
            void dog.offsetWidth;
            dog.classList.add('is-yipping');
            window.clearTimeout(banditYipEnd);
            banditYipEnd = window.setTimeout(() => {
                if (dog.isConnected) dog.classList.remove('is-yipping');
            }, 860);
        }

        function keepBanditYipping(dog, gen) {
            window.clearTimeout(banditYipLoop);
            const loop = () => {
                if (gen !== wranglerGen || !dog || !dog.isConnected || !pastureHoldsBandit()) return;
                if (dog.classList.contains('is-sitting') && remainingFieldSheep().length) {
                    banditYip(dog, gen);
                }
                banditYipLoop = window.setTimeout(loop, 2600 + Math.random() * 1800);
            };
            banditYipLoop = window.setTimeout(loop, 2000);
        }

        function setBanditSit(dog, sitting) {
            if (!dog) return;
            if (sitting) setBanditGait(dog, 'sit');
            else if (dog.classList.contains('is-sitting')) setBanditGait(dog, 'idle');
        }

        function watchThePen(dog, gen) {
            if (gen !== wranglerGen || !dog || !dog.isConnected) return;
            const spot = gateWatchSpot();
            const here = currentEwePoint(dog);
            if (Math.hypot(spot.gx - here.x, spot.gy - here.y) < 4) {
                setBanditSit(dog, true);
                window.setTimeout(() => runWrangler(dog, gen), 1200);
                return;
            }
            walkBanditTo(dog, spot.gx, spot.gy, () => {
                if (gen !== wranglerGen) return;
                setBanditSit(dog, true);
                window.setTimeout(() => runWrangler(dog, gen), 1000);
            }, { gait: Math.hypot(spot.gx - here.x, spot.gy - here.y) > 14 ? 'run' : 'walk' });
        }

        function pressureTheFlock(dog, gen) {
            dog.classList.remove('is-walking', 'is-running', 'is-jumping');
            setBanditSit(dog, false);
            banditYip(dog, gen);
            corralNearBandit(dog);
            window.setTimeout(() => {
                if (gen !== wranglerGen || !dog.isConnected) return;
                const stray = remainingFieldSheep().filter((el) => !isInHuddle(el));
                const local = stray.filter((el) => sheepNearBandit(dog, el));
                const moving = local.filter((el) => el.classList.contains('is-walking'));
                if (local.length && moving.length && moving.length >= local.length) {
                    setBanditSit(dog, true);
                    window.setTimeout(() => runWrangler(dog, gen), 850);
                    return;
                }
                runWrangler(dog, gen);
            }, 720);
        }

        function goBehindTarget(dog, gen, target, opts) {
            banditFocus = target;
            const behind = dogBehindSheep(target);
            const here = currentEwePoint(dog);
            const dist = Math.hypot(behind.gx - here.x, behind.gy - here.y);
            const finish = () => {
                if (gen !== wranglerGen) return;
                pressureTheFlock(dog, gen);
            };
            if (dist < 3.2 || isBanditBehind(dog, target)) {
                finish();
                return;
            }
            const outrun = !!(opts && opts.outrun);
            const reverse = (dog.classList.contains('is-left') ? 1 : -1) * (behind.gx - here.x) > 5;
            const start = () => walkBanditTo(dog, behind.gx, behind.gy, finish, {
                gait: outrun || dist > 13 ? 'run' : 'walk',
                outrun
            });
            if ((outrun && dist > 15) || (reverse && dist > 12)) {
                banditJumpToward(dog, behind, () => {
                    if (gen !== wranglerGen) return;
                    start();
                });
                return;
            }
            start();
        }

        function runWrangler(dog, gen) {
            if (gen !== wranglerGen || !dog || !dog.isConnected) return;
            if (!pastureHoldsBandit()) {
                resetWrangler(true);
                return;
            }
            const all = remainingFieldSheep();
            if (!all.length) {
                banditFocus = null;
                watchThePen(dog, gen);
                return;
            }
            const stray = all.filter((el) => !isInHuddle(el));
            if (!stray.length) {
                banditFocus = null;
                watchThePen(dog, gen);
                return;
            }
            const local = stray.filter((el) => sheepNearBandit(dog, el));
            const idle = idleHerdSheep().filter((el) => !isInHuddle(el));
            const idleLocal = idle.filter((el) => local.indexOf(el) !== -1);
            const localTarget = local.length
                ? pickHerdTarget(idleLocal.length ? idleLocal : local, dog)
                : null;
            const lifting = !!(localTarget && (isBanditBehind(dog, localTarget) || local.some((el) => el.classList.contains('is-walking'))));
            if (lifting && localTarget) {
                goBehindTarget(dog, gen, localTarget, { outrun: false });
                return;
            }
            const target = pickHerdTarget(idle.length ? idle : stray);
            if (!target) {
                banditFocus = null;
                watchThePen(dog, gen);
                return;
            }
            goBehindTarget(dog, gen, target, { outrun: true });
        }

        function startWrangler(opts) {
            const key = wranglerKey();
            const chorus = document.getElementById('flockChorus');
            if (!chorus || !pastureHoldsBandit()) return;
            let dog = chorus.querySelector('.tv-dog');
            if (wranglerQuestion === key && dog) return;
            wranglerQuestion = key;
            wranglerWasOut = true;
            wranglerGen += 1;
            const gen = wranglerGen;
            const restore = !!(opts && opts.restore);
            const spot = restore ? gateWatchSpot() : banditSpawnPoint();
            dog = ensureWrangler(spot);
            if (!dog) return;
            dog.classList.add('is-placed');
            dog.classList.remove('is-left', 'is-running', 'is-jumping', 'is-yipping');
            setBanditSit(dog, restore);
            dog.style.setProperty('--gx', String(spot.gx));
            dog.style.setProperty('--gy', String(spot.gy));
            dog.style.setProperty('--s', String(pastureScale(spot.gy)));
            dog.style.setProperty('--z', '52');
            requestAnimationFrame(() => {
                if (gen !== wranglerGen || !dog.isConnected) return;
                dog.classList.remove('is-placed');
                keepBanditYipping(dog, gen);
                keepCorrallingNearBandit(dog, gen);
                runWrangler(dog, gen);
            });
        }

        function syncWrangler(timeLeft) {
            if (!pastureHoldsBandit()) {
                if (document.querySelector('#flockChorus .tv-dog')) resetWrangler(true);
                return;
            }
            if (gameState.gameState === 'playing' && Number(timeLeft) <= banditAt()) {
                startWrangler();
                return;
            }
            if (gameState.gameState === 'grading' && wranglerWasOut && !document.querySelector('#flockChorus .tv-dog')) {
                startWrangler({ restore: true });
            }
        }

        function updateDisplayTimer(timeLeft) {
            const timerText = document.getElementById('displayTimer');
            const timerCircle = document.getElementById('timerCircle');
            
            if (!timerText || !timerCircle) return;
            
            // Add tick animation for countdown effect
            timerText.classList.add('tick');
            setTimeout(() => timerText.classList.remove('tick'), 300);
            
            // Update timer display
            timerText.textContent = timeLeft;
            
            timerCircle.classList.remove('urgent', 'warning');
            if (timeLeft <= 5) {
                timerCircle.classList.add('urgent');
            } else if (timeLeft <= 10) {
                timerCircle.classList.add('warning');
            }
            
            // Update gameState for consistency
            if (gameState) {
                gameState.timeLeft = timeLeft;
            }
            syncWrangler(timeLeft);
        }
        
        function updateResponseIndicator(responses, totalPlayers, answeredPlayers) {
            const responseText = document.getElementById('responseText');
            const chorus = document.getElementById('flockChorus');
            if (!chorus && !responseText) return;

            if (answeredPlayers && gameState) gameState.answeredPlayers = answeredPlayers;
            const players = (gameState && gameState.players) || [];
            const total = Number(totalPlayers) || players.length || 0;
            if (chorus && chorus.dataset.flockKey !== flockKey(players)) {
                renderFlock(players);
            }
            const rebuilt = chorus && chorus.dataset.ready !== '1';
            const painted = paintFlock(
                (gameState && gameState.answeredPlayers) || answeredPlayers || [],
                rebuilt,
                (gameState && gameState.sentBackPlayers) || []
            );
            const inCount = painted ? painted.inCount : (Number(responses) || 0);
            const flockTotal = painted ? painted.total : total;
            if (responseText) responseText.textContent = flockResponseLine(inCount, flockTotal);
        }

        function playRoundMeta() {
            const questionNumber = (Number(gameState && gameState.currentQuestion) || 0) + 1;
            const perRound = (gameState && gameState.questionsPerRound) || 1;
            const roundNumber = Math.ceil(questionNumber / Math.max(1, perRound));
            const questionInRound = ((questionNumber - 1) % Math.max(1, perRound)) + 1;
            return { questionNumber, perRound, roundNumber, questionInRound };
        }

        function currentPromptText() {
            const fromData = gameState && gameState.currentQuestionData && gameState.currentQuestionData.prompt;
            if (fromData) return fromData;
            const questions = gameState && gameState.questions;
            const q = Array.isArray(questions) ? questions[gameState.currentQuestion] : null;
            return (q && q.prompt) || '';
        }

        function rankedPlayers(list) {
            return (list || []).slice().sort((a, b) => (Number(b.score) || 0) - (Number(a.score) || 0));
        }

        function paintMeadowScreen(kind, overlayHtml, players) {
            if (kind !== 'tv-score') scoreParadeGen += 1;
            preventAllScrolling();
            const sky = (kind === 'tv-score' || kind === 'tv-standings') ? '' : skyNameHtml();
            document.getElementById('displayScreen').innerHTML = `
                <div class="tv-stage ${kind}">
                    ${pastureSceneHtml({ pen: false })}
                    ${sky}
                    ${overlayHtml}
                </div>
            `;
            renderFlock(players || (gameState && gameState.players) || []);
        }

        function tvRankRowsHtml(players, startAt, options) {
            const rows = players || [];
            const names = options && options.short ? rows.map((player) => player.name || 'Sheep') : null;
            return rows.map((player, index) => {
                const rank = (startAt || 0) + index + 1;
                const label = names ? flockLabel(player.name || 'Sheep', names) : player.name;
                return `
                    <li class="tv-rank-row${rank <= 3 ? ` is-${rank}` : ''}">
                        <span class="tv-rank-n">${rank}</span>
                        <span class="tv-rank-name">${escapeDisplayText(label)}</span>
                        <span class="tv-rank-pts">${Number(player.score) || 0}</span>
                    </li>
                `;
            }).join('');
        }

        function rankCols(count) {
            const n = Number(count) || 0;
            if (n > 24) return 3;
            if (n > 8) return 2;
            return 1;
        }

        function tvRankListHtml(players, startAt, options) {
            const rows = players || [];
            const cols = rankCols(rows.length);
            return `
                <ol class="tv-rank-list auto-scroll-content" style="--rank-cols:${cols}">
                    ${tvRankRowsHtml(rows, startAt, options)}
                </ol>
            `;
        }

        function armBoardScroll(id, count) {
            window.setTimeout(() => {
                const box = document.getElementById(id);
                if (!box) return;
                const content = box.querySelector('.auto-scroll-content') || box;
                if (content.scrollHeight > box.clientHeight + 8) {
                    startAutoScroll(id, count || 12);
                }
            }, 80);
        }

        function tvBannerMarkup(group, extras) {
            const extra = extras || {};
            const x = extra.x != null ? extra.x : group.x;
            const y = extra.y != null ? extra.y : group.y;
            const width = extra.width != null ? extra.width : group.width;
            const tilt = extra.tilt != null ? extra.tilt : (group.tilt || 0);
            const wait = extra.wait ? ' is-parade-wait' : '';
            const id = extra.id ? ` id="${extra.id}"` : '';
            const n = Number(group.count) || (group.players || []).length || 0;
            const kind = n === 1 ? ' is-pennant' : ' is-cloth';
            return `
                <div${id} class="tv-banner is-parade${kind}${wait}" data-answer="${escapeDisplayText(group.answer)}" data-holders="${n}" data-lanes="${Number(extra.lanes || PARADE_LANES)}" style="--x:${Number(x).toFixed(2)}%; --y:${Number(y).toFixed(2)}%; --mx:${Number(x).toFixed(2)}; --my:${Number(y).toFixed(2)}; --w:${Number(width).toFixed(2)}vw; --tilt:${Number(tilt).toFixed(2)}deg; --z:${Number(group.z || extra.z || 8)}; --walk:0s">
                    <div class="tv-flag tv-flag-cloth">
                        <img class="tv-flag-art" src="sprites/parade-banner.png?v=2026-11-19T23-20-00" alt="" aria-hidden="true">
